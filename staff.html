<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Management</title>
    <script src="supabase-init.js"></script>
    <!-- SWEETALERT 2 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        /* MINIMALIST & MOBILE-OPTIMIZED BASE */
        body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f9fafb; color: #111827; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* Flex changes to column on mobile */
        .main-content { flex-grow: 1; padding: 20px; display: flex; gap: 20px; height: calc(100vh - 60px); box-sizing: border-box; }
        
        /* DIRECTORY PANE */
        .directory-pane { width: 300px; background: #ffffff; border-radius: 8px; border: 1px solid #e5e7eb; display: flex; flex-direction: column; flex-shrink: 0; }
        .pane-header { padding: 15px; border-bottom: 1px solid #f3f4f6; display: flex; justify-content: space-between; align-items: center; background: #f9fafb; }
        .pane-header h3 { margin: 0; font-size: 1.1em; font-weight: 600; }
        
        .staff-list { overflow-y: auto; flex-grow: 1; padding: 10px; }
        .staff-item { padding: 12px 15px; border-radius: 6px; cursor: pointer; margin-bottom: 4px; border: 1px solid transparent; font-weight: 500; font-size: 0.9em; transition: 0.2s; }
        .staff-item:hover { background: #f3f4f6; }
        .staff-item.active { background: #eff6ff; border-color: #bfdbfe; color: #1d4ed8; }

        /* DASHBOARD PANE */
        .dashboard-pane { flex-grow: 1; background: #ffffff; border-radius: 8px; border: 1px solid #e5e7eb; display: none; flex-direction: column; overflow: hidden; }
        .dash-header { padding: 20px; border-bottom: 1px solid #f3f4f6; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .staff-name { font-size: 1.4em; font-weight: 700; margin: 0; }
        .staff-role { font-size: 0.75em; color: #6b7280; text-transform: uppercase; font-weight: 600; letter-spacing: 1px; }
        
        /* SPLIT VIEW (Stacks on mobile) */
        .split-view { display: flex; flex-grow: 1; overflow: hidden; flex-direction: row; }
        .calendar-section { flex: 1; padding: 20px; border-right: 1px solid #f3f4f6; overflow-y: auto; }
        .history-section { flex: 1; padding: 20px; overflow-y: auto; background: #f9fafb; }
        
        h4 { margin-top: 0; font-size: 0.95em; color: #4b5563; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid #e5e7eb; padding-bottom: 10px; display: flex; justify-content: space-between;}

        /* 3-CLICK CALENDAR GRID */
        .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-top: 15px; }
        .cal-day-header { text-align: center; font-size: 0.7em; font-weight: 700; color: #9ca3af; text-transform: uppercase; }
        .cal-cell { aspect-ratio: 1; border-radius: 6px; border: 2px solid #e5e7eb; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 0.9em; cursor: pointer; user-select: none; transition: 0.15s; background: #ffffff; color: #9ca3af; }
        .cal-cell.empty { border: none; background: transparent; cursor: default; }

        /* THE 3 STATES */
        .state-FULL { background: #10b981; border-color: #10b981; color: white; }
        .state-LEAVE { background: #ef4444; border-color: #ef4444; color: white; }
        .state-HALF { background: #f59e0b; border-color: #f59e0b; color: white; }

        /* HISTORY TABLE */
        .history-table { width: 100%; border-collapse: collapse; font-size: 0.85em; }
        .history-table th { text-align: left; padding: 10px; border-bottom: 2px solid #e5e7eb; color: #6b7280; font-weight: 600; }
        .history-table td { padding: 12px 10px; border-bottom: 1px solid #e5e7eb; color: #1f2937; }

        button.btn { background: #111827; color: #fff; border: none; padding: 8px 14px; border-radius: 6px; font-weight: 500; cursor: pointer; font-size: 0.9em; }
        button.btn:hover { background: #374151; }
        
        #unauthorized { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; width: 100%; text-align: center; color: #ef4444; font-weight: 600; font-size: 1.1em; padding: 20px; box-sizing: border-box; }

        /* --- MOBILE OPTIMIZATION --- */
        @media (max-width: 768px) {
            body { overflow: auto; }
            .main-content { flex-direction: column; height: auto; overflow: visible; padding: 15px; }
            .directory-pane { width: 100%; height: 250px; flex-shrink: 0; }
            .dashboard-pane { width: 100%; overflow: visible; }
            .split-view { flex-direction: column; }
            .calendar-section { border-right: none; border-bottom: 1px solid #f3f4f6; }
            .cal-cell { font-size: 1em; }
        }
    </style>
</head>
<body>

    <script src="navbar.js"></script>

    <!-- ADMIN ONLY WRAPPER -->
    <div id="unauthorized">Verifying Admin Credentials...</div>

    <main class="main-content hidden" id="admin-content">
        
        <!-- LEFT: STAFF DIRECTORY -->
        <div class="directory-pane">
            <div class="pane-header">
                <h3>Staff Team</h3>
                <button class="btn" onclick="Swal.fire('Coming Soon', 'Staff creation module is under construction.', 'info')">+ Add</button>
            </div>
            <div class="staff-list" id="staff-list">
                <div style="padding: 20px; text-align: center; color: #9ca3af;">Loading staff...</div>
            </div>
        </div>

        <!-- RIGHT: DASHBOARD -->
        <div class="dashboard-pane" id="dashboard-pane">
            <div class="dash-header">
                <div>
                    <div class="staff-role">Staff Member</div>
                    <div class="staff-name" id="selected-staff-name">Loading...</div>
                </div>
                <button class="btn" onclick="logStaffPayment()">+ Log Payment</button>
            </div>
            
            <div class="split-view">
                <!-- CALENDAR SECTION -->
                <div class="calendar-section">
                    <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e5e7eb; padding-bottom: 10px; margin-bottom: 15px;">
                        <h4 style="border: none; padding: 0; margin: 0;">
                            <span id="calendar-month-title">Current Month</span> 
                        </h4>
                        <!-- BATCH SAVE BUTTON -->
                        <button id="save-attendance-btn" class="btn" style="background: #10b981; display: none;" onclick="saveAttendance()">Save Changes</button>
                    </div>
                    <div style="font-size: 0.75em; color: #6b7280; margin-bottom: 15px;">
                        Tap a day to toggle: <span style="color:#10b981; font-weight:bold;">1. Full</span> | <span style="color:#ef4444; font-weight:bold;">2. Leave</span> | <span style="color:#f59e0b; font-weight:bold;">3. Half</span>
                    </div>
                    
                    <div class="cal-grid" id="calendar-grid">
                        <!-- JS Will Inject Actual Calendar Here -->
                    </div>
                </div>
                
                <!-- PAYMENT HISTORY SECTION -->
                <div class="history-section">
                    <h4>Payment History</h4>
                    <table class="history-table">
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Method</th>
                                <th style="text-align: right;">Amount (₹)</th>
                            </tr>
                        </thead>
                        <tbody id="payment-history">
                            <tr><td colspan="3" style="text-align:center; padding: 20px; color: #9ca3af;">Loading history...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </main>

    <script>
        let currentShopId = null;
        let activeStaffId = null;
        let currentYear = new Date().getFullYear();
        let currentMonth = new Date().getMonth(); // 0 = Jan, 11 = Dec
        let originalAttendanceMap = {}; // Memory for batch saves

        const STATES = ['NONE', 'FULL', 'LEAVE', 'HALF'];

        window.onload = () => {
            setTimeout(async () => {
                try {
                    const { data: userData, error: authError } = await supabaseClient.auth.getUser();
                    
                    if (authError || !userData || !userData.user) {
                        document.getElementById('unauthorized').innerText = "ACCESS DENIED: Not logged in.";
                        return;
                    }

                    const { data: profile, error: profileError } = await supabaseClient
                        .from('user_profiles')
                        .select('role, shop_id')
                        .eq('id', userData.user.id)
                        .single();

                    if (profileError) {
                        document.getElementById('unauthorized').innerText = "Database Error: " + profileError.message;
                        return;
                    }

                    if (profile && profile.role === 'admin') {
                        currentShopId = profile.shop_id;
                        document.getElementById('unauthorized').classList.add('hidden');
                        document.getElementById('admin-content').classList.remove('hidden');
                        await loadStaffList();
                    } else {
                        document.getElementById('unauthorized').innerText = "ACCESS DENIED: Admin Privileges Required.";
                    }
                } catch (err) {
                    document.getElementById('unauthorized').innerText = "System Error: " + err.message;
                }
            }, 600);
        };

        async function loadStaffList() {
            const { data: staff, error } = await supabaseClient.from('staff').select('id, name').eq('shop_id', currentShopId);
            const list = document.getElementById('staff-list');
            list.innerHTML = '';

            if (error) {
                list.innerHTML = `<div style="padding: 20px; text-align: center; color: #ef4444;">Error loading staff.</div>`;
                return;
            }

            if (staff && staff.length > 0) {
                staff.forEach(s => {
                    list.innerHTML += `<div class="staff-item" onclick="openStaff('${s.id}', '${s.name}', this)">${s.name}</div>`;
                });
            } else {
                list.innerHTML = `<div style="padding: 20px; text-align: center; color: #9ca3af;">No staff found.</div>`;
            }
        }

        async function openStaff(id, name, element) {
            activeStaffId = id;
            document.querySelectorAll('.staff-item').forEach(el => el.classList.remove('active'));
            element.classList.add('active');
            
            document.getElementById('dashboard-pane').style.display = 'flex';
            document.getElementById('selected-staff-name').innerText = name;

            await generateCalendar();
            await loadPaymentHistory();
        }

        // --- CALENDAR UI & DATABASE BATCH SYNC ---
        
        async function generateCalendar() {
            const grid = document.getElementById('calendar-grid');
            grid.innerHTML = '';
            document.getElementById('save-attendance-btn').style.display = 'none'; // Hide save button initially
            
            const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
            document.getElementById('calendar-month-title').innerText = `${monthNames[currentMonth]} ${currentYear}`;

            const days = ['S', 'M', 'T', 'W', 'T', 'F', 'S'];
            days.forEach(d => grid.innerHTML += `<div class="cal-day-header">${d}</div>`);

            // Fetch existing attendance
            const startDate = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-01`;
            const endDate = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-31`;
            
            const { data: records, error } = await supabaseClient.from('staff_attendance')
                .select('record_date, status')
                .eq('staff_id', activeStaffId)
                .gte('record_date', startDate)
                .lte('record_date', endDate);
            
            if (error) {
                console.error("Error fetching attendance:", error);
                Swal.fire('Error', 'Failed to load attendance records.', 'error');
            }

            originalAttendanceMap = {}; // Reset memory
            if (records) {
                records.forEach(r => { originalAttendanceMap[r.record_date] = r.status; });
            }

            const firstDayIndex = new Date(currentYear, currentMonth, 1).getDay(); 
            const totalDaysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();

            // Pad blank days
            for(let i = 0; i < firstDayIndex; i++) {
                grid.innerHTML += `<div class="cal-cell empty"></div>`;
            }

            // Generate actual days
            for (let day = 1; day <= totalDaysInMonth; day++) {
                const dateStr = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const savedStatus = originalAttendanceMap[dateStr] || 'NONE';
                const stateIdx = STATES.indexOf(savedStatus);
                const colorClass = savedStatus !== 'NONE' ? `state-${savedStatus}` : '';

                grid.innerHTML += `
                    <div class="cal-cell ${colorClass}" 
                         data-state="${stateIdx}" 
                         data-date="${dateStr}" 
                         onclick="toggleAttendance(this)">
                        ${day}
                    </div>
                `;
            }
        }

        function toggleAttendance(element) {
            let currentStateIdx = parseInt(element.getAttribute('data-state'));
            let nextStateIdx = (currentStateIdx + 1) % STATES.length;
            const stateName = STATES[nextStateIdx];
            
            // Instantly update UI
            element.setAttribute('data-state', nextStateIdx);
            element.classList.remove('state-FULL', 'state-LEAVE', 'state-HALF');
            if (stateName !== 'NONE') element.classList.add(`state-${stateName}`);
            
            // Reveal the Save button
            document.getElementById('save-attendance-btn').style.display = 'block';
        }

        async function saveAttendance() {
            const btn = document.getElementById('save-attendance-btn');
            btn.innerText = "Saving...";
            btn.style.opacity = "0.7";
            btn.disabled = true;

            const upserts = [];
            const deletes = [];

            // Scan the grid for changes
            document.querySelectorAll('.cal-cell:not(.empty)').forEach(cell => {
                const dateStr = cell.getAttribute('data-date');
                const stateIdx = parseInt(cell.getAttribute('data-state'));
                const stateName = STATES[stateIdx];
                const originalState = originalAttendanceMap[dateStr] || 'NONE';

                if (stateName !== originalState) {
                    if (stateName === 'NONE') {
                        deletes.push(dateStr);
                    } else {
                        upserts.push({
                            shop_id: currentShopId,
                            staff_id: activeStaffId,
                            record_date: dateStr,
                            status: stateName
                        });
                    }
                }
            });

            // Execute Batch Saves
            if (upserts.length > 0) {
                const { error } = await supabaseClient.from('staff_attendance').upsert(upserts, { onConflict: 'staff_id,record_date' });
                if (error) return Swal.fire('Error', 'Failed to save attendance: ' + error.message, 'error');
            }

            // Execute Batch Deletes
            if (deletes.length > 0) {
                const { error } = await supabaseClient.from('staff_attendance')
                    .delete()
                    .eq('staff_id', activeStaffId)
                    .in('record_date', deletes);
                if (error) return Swal.fire('Error', 'Failed to clear attendance: ' + error.message, 'error');
            }

            // Reset UI
            btn.innerText = "Saved!";
            btn.style.background = "#059669";
            
            setTimeout(() => {
                generateCalendar(); 
            }, 800);
        }

        // --- PAYMENT HISTORY LOGIC ---

        async function loadPaymentHistory() {
            const { data: txns, error } = await supabaseClient.from('daily_transactions')
                .select('created_at, amount, payment_method')
                .eq('staff_id', activeStaffId)
                .eq('transaction_type', 'EXPENSE')
                .order('created_at', { ascending: false })
                .limit(10);

            const tbody = document.getElementById('payment-history');
            tbody.innerHTML = '';

            if (txns && txns.length > 0) {
                txns.forEach(txn => {
                    const date = new Date(txn.created_at).toLocaleDateString('en-IN', { month: 'short', day: 'numeric', year: 'numeric' });
                    tbody.innerHTML += `
                        <tr>
                            <td>${date}</td>
                            <td style="font-size: 0.85em; color: #6b7280;">${txn.payment_method}</td>
                            <td style="text-align: right; font-weight: 600; color: #dc2626;">₹ ${parseFloat(txn.amount).toFixed(2)}</td>
                        </tr>
                    `;
                });
            } else {
                tbody.innerHTML = `<tr><td colspan="3" style="text-align:center; padding: 20px; color: #9ca3af;">No payments logged yet.</td></tr>`;
            }
        }

        async function logStaffPayment() {
            // Using SweetAlert for the Input Prompt
            const { value: amountStr } = await Swal.fire({
                title: 'Record Staff Payment',
                input: 'number',
                inputLabel: 'Amount (₹)',
                inputPlaceholder: 'e.g. 5000',
                showCancelButton: true,
                confirmButtonText: 'Next',
                confirmButtonColor: '#10b981'
            });

            if (!amountStr) return;
            const amount = parseFloat(amountStr);
            if (isNaN(amount) || amount <= 0) {
                return Swal.fire('Invalid Amount', 'Please enter a valid number greater than 0.', 'error');
            }

            // Using SweetAlert for the Confirmation
            const confirmResult = await Swal.fire({
                title: 'Confirm Payment',
                text: `You are about to record a cash payment of ₹${amount} to this staff member. Proceed?`,
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#10b981',
                cancelButtonColor: '#ef4444',
                confirmButtonText: 'Yes, log payment!'
            });

            if (!confirmResult.isConfirmed) return;

            // Submit to Database
            const { error } = await supabaseClient.from('daily_transactions').insert([{
                shop_id: currentShopId,
                staff_id: activeStaffId,
                transaction_type: 'EXPENSE',
                category: 'staff',
                payment_method: 'CASH',
                amount: amount,
                reference_note: 'Staff Payout (Admin)',
                status: 'open'
            }]);

            if (error) {
                return Swal.fire('Error', 'Failed to save payment: ' + error.message, 'error');
            }
            
            // Success Notification
            Swal.fire({
                title: 'Success!',
                text: 'Payment recorded successfully.',
                icon: 'success',
                timer: 1500,
                showConfirmButton: false
            });
            
            await loadPaymentHistory(); 
        }
    </script>
</body>
</html>
