<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accounts Directory</title>
    <script src="supabase-init.js"></script>
    <style>
        /* ULTRA-MINIMALIST UI */
        body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f9fafb; color: #111827; display: flex; height: 100vh; overflow: hidden; }
        .main-content { flex-grow: 1; padding: 40px; display: flex; gap: 30px; height: calc(100vh - 80px); }
        
        /* SPLIT LAYOUT */
        .directory-pane { width: 350px; background: #ffffff; border-radius: 8px; border: 1px solid #e5e7eb; display: flex; flex-direction: column; overflow: hidden; }
        .ledger-pane { flex-grow: 1; background: #ffffff; border-radius: 8px; border: 1px solid #e5e7eb; display: flex; flex-direction: column; overflow: hidden; }
        
        /* DIRECTORY PANE */
        .pane-header { padding: 20px; border-bottom: 1px solid #f3f4f6; background: #f9fafb; display: flex; justify-content: space-between; align-items: center; }
        .pane-header h3 { margin: 0; font-size: 1.1em; font-weight: 600; color: #111827; }
        
        .tab-group { display: flex; border-bottom: 1px solid #f3f4f6; }
        .tab { flex: 1; padding: 12px; text-align: center; font-size: 0.85em; font-weight: 600; color: #6b7280; cursor: pointer; text-transform: uppercase; background: #ffffff; border-bottom: 2px solid transparent; transition: 0.2s; }
        .tab.active { color: #111827; border-bottom-color: #111827; background: #f9fafb; }
        
        .account-list { overflow-y: auto; flex-grow: 1; padding: 10px; }
        .account-item { padding: 15px; border-radius: 6px; cursor: pointer; margin-bottom: 5px; border: 1px solid transparent; transition: 0.2s; display: flex; justify-content: space-between; align-items: center; }
        .account-item:hover { background: #f3f4f6; }
        .account-item.active { background: #f0fdf4; border-color: #bbf7d0; }
        .account-name { font-weight: 600; font-size: 0.95em; }
        .account-balance { font-size: 0.85em; font-weight: 600; color: #dc2626; } /* Red by default for what we owe */

        /* LEDGER PANE (PASSBOOK) */
        .ledger-header { padding: 30px; border-bottom: 1px solid #f3f4f6; text-align: center; }
        .ledger-title { font-size: 1.5em; font-weight: 700; margin: 0 0 5px 0; }
        .ledger-subtitle { color: #6b7280; font-size: 0.85em; text-transform: uppercase; letter-spacing: 1px; font-weight: 600; }
        .ledger-amount { font-size: 3em; font-weight: 800; margin: 15px 0 0 0; letter-spacing: -1px; color: #dc2626; }
        
        .ledger-actions { display: flex; gap: 15px; justify-content: center; padding: 20px; background: #f9fafb; border-bottom: 1px solid #f3f4f6; }
        
        .history-container { overflow-y: auto; flex-grow: 1; padding: 20px; }
        .history-table { width: 100%; border-collapse: collapse; font-size: 0.9em; }
        .history-table th { text-align: left; padding: 10px; border-bottom: 2px solid #e5e7eb; color: #6b7280; font-weight: 500; font-size: 0.85em; }
        .history-table td { padding: 12px 10px; border-bottom: 1px solid #f3f4f6; color: #1f2937; }
        
        /* CLEAN BUTTONS & INPUTS */
        button.btn { background-color: #111827; color: #ffffff; border: none; cursor: pointer; font-weight: 500; padding: 10px 15px; border-radius: 6px; font-size: 0.9em; transition: 0.2s; }
        button.btn:hover { background-color: #374151; }
        button.btn-outline { background-color: transparent; color: #111827; border: 1px solid #d1d5db; }
        button.btn-outline:hover { background: #f3f4f6; }
        
        .text-green { color: #059669; font-weight: 600; } 
        .text-red { color: #dc2626; font-weight: 600; }
        
        .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: #9ca3af; text-align: center; padding: 40px; }

        @media (max-width: 768px) {
            .main-content { flex-direction: column; height: auto; }
            .directory-pane { width: 100%; height: 300px; }
        }
    </style>
</head>
<body>

    <script src="navbar.js"></script>

    <main class="main-content">
        
        <!-- LEFT COLUMN: DIRECTORY -->
        <div class="directory-pane">
            <div class="pane-header">
                <h3>Directory</h3>
                <button class="btn btn-outline" onclick="openNewAccountModal()" style="padding: 6px 12px; font-size: 0.8em;">+ Add New</button>
            </div>
            
            <div class="tab-group">
                <div class="tab active" id="tab-vendors" onclick="switchTab('vendors')">Vendors</div>
                <div class="tab" id="tab-finances" onclick="switchTab('finances')">Finances</div>
            </div>
            
            <div class="account-list" id="account-list">
                <!-- Javascript will inject list items here -->
                <div class="empty-state">Loading accounts...</div>
            </div>
        </div>

        <!-- RIGHT COLUMN: LEDGER PASSBOOK -->
        <div class="ledger-pane" id="ledger-pane" style="display: none;">
            <div class="ledger-header">
                <div class="ledger-subtitle" id="ledger-type">Vendor Account</div>
                <h2 class="ledger-title" id="ledger-name">Loading...</h2>
                <div style="font-size: 0.8em; color: #6b7280; margin-top: 10px;">TOTAL OUTSTANDING BALANCE</div>
                <div class="ledger-amount">₹ <span id="ledger-balance">0.00</span></div>
            </div>
            
            <div class="ledger-actions">
                <button class="btn" onclick="logIncomingBill()">+ Log New Bill (Owe More)</button>
                <button class="btn btn-outline" onclick="jumpToPayment()">Make Payment (Owe Less)</button>
            </div>
            
            <div class="history-container">
                <table class="history-table">
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Description</th>
                            <th>Type</th>
                            <th style="text-align: right;">Amount (₹)</th>
                        </tr>
                    </thead>
                    <tbody id="ledger-history">
                        <tr><td colspan="4" style="text-align:center; padding: 20px; color: #9ca3af;">Select an account to view history.</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- PLACEHOLDER FOR NO SELECTION -->
        <div class="ledger-pane empty-state" id="no-selection-pane">
            <svg width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24" style="margin-bottom: 15px; opacity: 0.5;">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.042A8.967 8.967 0 006 3.75c-1.052 0-2.062.18-3 .512v14.25A8.987 8.987 0 016 18c2.305 0 4.408.867 6 2.292m0-14.25a8.966 8.966 0 016-2.292c1.052 0 2.062.18 3 .512v14.25A8.987 8.987 0 0018 18a8.967 8.967 0 00-6 2.292m0-14.25v14.25"></path>
            </svg>
            Select an account from the directory to view its passbook and transaction history.
        </div>

    </main>

    <script>
        let currentShopId = null;
        let activeTab = 'vendors';
        let allVendors = [];

        window.onload = () => {
            setTimeout(async () => {
                const { data: shopData } = await supabaseClient.from('shops').select('id').single();
                if (shopData) {
                    currentShopId = shopData.id;
                    await fetchDirectoryData();
                }
            }, 500); 
        };

        function switchTab(tabName) {
            activeTab = tabName;
            document.getElementById('tab-vendors').classList.remove('active');
            document.getElementById('tab-finances').classList.remove('active');
            document.getElementById(`tab-${tabName}`).classList.add('active');
            
            document.getElementById('ledger-pane').style.display = 'none';
            document.getElementById('no-selection-pane').style.display = 'flex';
            
            renderList();
        }

        async function fetchDirectoryData() {
            if(!currentShopId) return;
            
            // Fetch Vendors
            const { data: vendors, error } = await supabaseClient.from('vendors').select('*').eq('shop_id', currentShopId);
            if (!error && vendors) {
                allVendors = vendors;
            }
            
            renderList();
        }

        function renderList() {
            const listContainer = document.getElementById('account-list');
            listContainer.innerHTML = '';

            if (activeTab === 'vendors') {
                if (allVendors.length === 0) {
                    listContainer.innerHTML = '<div class="empty-state" style="padding: 20px; font-size: 0.9em;">No vendors found. Click "Add New" to create one.</div>';
                    return;
                }

                allVendors.forEach(v => {
                    const balance = parseFloat(v.outstanding_balance || 0).toFixed(2);
                    listContainer.innerHTML += `
                        <div class="account-item" onclick="openLedger('${v.id}', '${v.name}', ${balance}, 'VENDOR')">
                            <span class="account-name">${v.name}</span>
                            <span class="account-balance">₹ ${balance}</span>
                        </div>
                    `;
                });
            } else if (activeTab === 'finances') {
                // Placeholder for finances until we build the finances table
                listContainer.innerHTML = '<div class="empty-state" style="padding: 20px; font-size: 0.9em;">Finance accounts coming in next step.</div>';
            }
        }

        function openLedger(id, name, balance, type) {
            document.getElementById('no-selection-pane').style.display = 'none';
            document.getElementById('ledger-pane').style.display = 'flex';
            
            document.getElementById('ledger-name').innerText = name;
            document.getElementById('ledger-balance').innerText = balance.toFixed(2);
            document.getElementById('ledger-type').innerText = type + ' ACCOUNT';

            // Highlighting the active item in the list
            document.querySelectorAll('.account-item').forEach(el => el.classList.remove('active'));
            event.currentTarget.classList.add('active');

            // Placeholder for fetching history
            document.getElementById('ledger-history').innerHTML = `
                <tr><td colspan="4" style="text-align:center; padding: 20px; color: #9ca3af;">Loading history... (Requires new database table)</td></tr>
            `;
        }

        function openNewAccountModal() {
            // We will build a sleek modal for this in the next step. For now:
            alert("This will open a clean pop-up to create a Vendor or Finance account.");
        }

        function logIncomingBill() {
            alert("This will log a new bill received from the vendor, increasing the amount you owe them.");
        }

        function jumpToPayment() {
            alert("Redirecting to Dashboard/Master Ledger to record an actual payment out of your cash drawer or bank.");
        }
    </script>
</body>
</html>
