<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accounts & Vendors</title>
    <script src="supabase-init.js"></script>
    <style>
        /* MINIMALIST BASE */
        body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f9fafb; color: #111827; display: flex; height: 100vh; overflow: hidden; }
        .main-content { flex-grow: 1; padding: 30px; display: flex; gap: 25px; height: calc(100vh - 60px); }
        
        /* LAYOUT PANES */
        .directory-pane { width: 320px; background: #ffffff; border-radius: 8px; border: 1px solid #e5e7eb; display: flex; flex-direction: column; }
        .right-pane { flex-grow: 1; background: #ffffff; border-radius: 8px; border: 1px solid #e5e7eb; display: flex; flex-direction: column; overflow: hidden; position: relative; }
        
        /* DIRECTORY (LEFT) */
        .pane-header { padding: 15px 20px; border-bottom: 1px solid #f3f4f6; display: flex; justify-content: space-between; align-items: center; background: #f9fafb; }
        .pane-header h3 { margin: 0; font-size: 1.1em; font-weight: 600; }
        
        .tab-group { display: flex; border-bottom: 1px solid #f3f4f6; }
        .tab { flex: 1; padding: 10px; text-align: center; font-size: 0.8em; font-weight: 600; color: #6b7280; cursor: pointer; text-transform: uppercase; border-bottom: 2px solid transparent; }
        .tab.active { color: #111827; border-bottom-color: #111827; background: #f9fafb; }
        
        .account-list { overflow-y: auto; flex-grow: 1; padding: 10px; }
        .account-item { padding: 12px 15px; border-radius: 6px; cursor: pointer; margin-bottom: 4px; display: flex; justify-content: space-between; align-items: center; border: 1px solid transparent; }
        .account-item:hover { background: #f3f4f6; }
        .account-item.active { background: #f0fdf4; border-color: #bbf7d0; }
        .acc-name { font-weight: 500; font-size: 0.9em; }
        .acc-bal { font-size: 0.85em; font-weight: 600; color: #dc2626; }

        /* VIEW: PASSBOOK (RIGHT) */
        .passbook-view { display: none; flex-direction: column; height: 100%; }
        .pb-header { padding: 25px; text-align: center; border-bottom: 1px solid #f3f4f6; }
        .pb-type { font-size: 0.75em; font-weight: 600; color: #6b7280; text-transform: uppercase; letter-spacing: 1px; }
        .pb-name { font-size: 1.5em; font-weight: 700; margin: 5px 0; }
        .pb-bal { font-size: 2.5em; font-weight: 700; color: #dc2626; margin-top: 10px; letter-spacing: -1px; }
        
        .pb-actions { display: flex; gap: 15px; justify-content: center; padding: 15px; background: #f9fafb; border-bottom: 1px solid #f3f4f6; }
        
        .history-table { width: 100%; border-collapse: collapse; font-size: 0.85em; }
        .history-table th { text-align: left; padding: 12px 20px; border-bottom: 2px solid #e5e7eb; color: #6b7280; font-weight: 600; text-transform: uppercase; font-size: 0.9em; }
        .history-table td { padding: 12px 20px; border-bottom: 1px solid #f3f4f6; color: #1f2937; }

        /* VIEW: CREATE ACCOUNT (RIGHT) */
        .create-view { display: none; flex-direction: column; padding: 30px; max-width: 500px; margin: 0 auto; width: 100%; }
        .create-view h2 { margin-top: 0; font-size: 1.2em; border-bottom: 1px solid #e5e7eb; padding-bottom: 10px; margin-bottom: 20px; }
        
        label { display: block; font-size: 0.8em; font-weight: 600; color: #4b5563; margin-top: 15px; margin-bottom: 5px; }
        input { width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 6px; background: #f9fafb; font-size: 0.95em; outline: none; box-sizing: border-box; }
        input:focus { border-color: #111827; background: #fff; }
        
        .help-text { font-size: 0.75em; color: #9ca3af; margin-top: 4px; display: block; }

        /* UTILS */
        .hidden { display: none !important; }
        .empty-state { display: flex; align-items: center; justify-content: center; height: 100%; color: #9ca3af; font-size: 0.9em; text-align: center; padding: 20px; flex-direction: column; }
        
        button.btn { background: #111827; color: #fff; border: none; padding: 10px 16px; border-radius: 6px; font-weight: 500; cursor: pointer; font-size: 0.9em; }
        button.btn:hover { background: #374151; }
        button.btn-outline { background: #fff; color: #111827; border: 1px solid #d1d5db; }
        button.btn-outline:hover { background: #f9fafb; }
        button.btn-green { background: #059669; }
        button.btn-green:hover { background: #047857; }
        
        @media (max-width: 768px) {
            .main-content { flex-direction: column; height: auto; }
            .directory-pane { width: 100%; height: 350px; }
        }
    </style>
</head>
<body>

    <script src="navbar.js"></script>

    <main class="main-content">
        
        <!-- LEFT: DIRECTORY PANE -->
        <div class="directory-pane">
            <div class="pane-header">
                <h3>Directory</h3>
                <!-- THIS BUTTON IS HIDDEN UNLESS ADMIN -->
                <button class="btn btn-outline admin-only hidden" onclick="showCreateView()" style="padding: 4px 10px; font-size: 0.8em;">+ Add New</button>
            </div>
            
            <div class="tab-group">
                <div class="tab active" id="tab-vendors" onclick="switchTab('vendors')">Vendors</div>
                <div class="tab" id="tab-finances" onclick="switchTab('finances')">Finances</div>
            </div>
            
            <div class="account-list" id="account-list">
                <div class="empty-state">Loading...</div>
            </div>
        </div>

        <!-- RIGHT: DYNAMIC PANE -->
        <div class="right-pane">
            
            <!-- DEFAULT STATE: EMPTY -->
            <div id="view-empty" class="empty-state" style="display: flex;">
                Select an account from the left to view history, or create a new one.
            </div>

            <!-- STATE 1: PASSBOOK (VIEW ACCOUNT) -->
            <div id="view-passbook" class="passbook-view">
                <div class="pb-header">
                    <div class="pb-type" id="pb-type">Vendor</div>
                    <div class="pb-name" id="pb-name">Loading...</div>
                    <div style="font-size: 0.75em; color: #6b7280; margin-top: 10px; font-weight: 600;">WE CURRENTLY OWE</div>
                    <div class="pb-bal">₹ <span id="pb-bal">0.00</span></div>
                </div>
                
                <div class="pb-actions">
                    <button class="btn btn-green" onclick="alert('Will open Add Bill pop-up')">+ Add Due Bill</button>
                    <button class="btn btn-outline" onclick="alert('Will jump to Dashboard to pay')">Record Payment</button>
                </div>
                
                <div style="overflow-y: auto; flex-grow: 1;">
                    <table class="history-table">
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Bill No. / Ref</th>
                                <th>Type</th>
                                <th style="text-align: right;">Amount (₹)</th>
                            </tr>
                        </thead>
                        <tbody id="pb-history">
                            <tr><td colspan="4" class="empty-state" style="border:none;">No bills or payments logged yet.</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- STATE 2: CREATE ACCOUNT (ADMIN ONLY) -->
            <div id="view-create" class="create-view">
                <h2>Create New Account</h2>
                
                <label>Account Type</label>
                <select id="new-type" style="width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #d1d5db;">
                    <option value="vendor">Vendor / Supplier</option>
                    <option value="finance">Finance / Bank</option>
                </select>

                <label>Account Name (Required)</label>
                <input type="text" id="new-name" placeholder="e.g., Supply Co. or HDFC Bank">
                
                <label>Phone Number <span style="font-weight: normal; color: #9ca3af;">(Optional)</span></label>
                <input type="text" id="new-phone" placeholder="e.g., 9876543210">

                <label>GST / Tax ID <span style="font-weight: normal; color: #9ca3af;">(Optional)</span></label>
                <input type="text" id="new-gst" placeholder="e.g., 29ABCDE1234F1Z5">

                <label>Opening Balance (₹) <span style="font-weight: normal; color: #9ca3af;">(Optional)</span></label>
                <input type="number" id="new-balance" placeholder="0.00">
                <span class="help-text">Amount you *already owe* before using this software.</span>

                <div style="margin-top: 25px; display: flex; gap: 10px;">
                    <button class="btn" onclick="saveNewAccount()">Save Account</button>
                    <button class="btn btn-outline" onclick="showEmptyView()">Cancel</button>
                </div>
            </div>

        </div>
    </main>

    <script>
        let currentShopId = null;
        let isAdmin = false;
        let activeTab = 'vendors';
        let allVendors = [];

        window.onload = () => {
            setTimeout(async () => {
                // Check auth & role
                const { data: userData } = await supabaseClient.auth.getUser();
                if (userData && userData.user) {
                    const { data: profile } = await supabaseClient.from('user_profiles').select('role, shop_id').eq('id', userData.user.id).single();
                    if (profile) {
                        currentShopId = profile.shop_id;
                        isAdmin = (profile.role === 'admin');
                        
                        // Show Admin buttons if authorized
                        if (isAdmin) {
                            document.querySelectorAll('.admin-only').forEach(el => el.classList.remove('hidden'));
                        }

                        await fetchDirectory();
                    }
                }
            }, 500); 
        };

        // --- UI NAVIGATION ---
        
        function switchTab(tabName) {
            activeTab = tabName;
            document.getElementById('tab-vendors').classList.remove('active');
            document.getElementById('tab-finances').classList.remove('active');
            document.getElementById(`tab-${tabName}`).classList.add('active');
            showEmptyView();
            renderList();
        }

        function showEmptyView() {
            document.getElementById('view-empty').style.display = 'flex';
            document.getElementById('view-passbook').style.display = 'none';
            document.getElementById('view-create').style.display = 'none';
            document.querySelectorAll('.account-item').forEach(el => el.classList.remove('active'));
        }

        function showCreateView() {
            document.getElementById('view-empty').style.display = 'none';
            document.getElementById('view-passbook').style.display = 'none';
            document.getElementById('view-create').style.display = 'flex';
            document.querySelectorAll('.account-item').forEach(el => el.classList.remove('active'));
        }

        function openPassbook(element, id, name, balance, type) {
            document.getElementById('view-empty').style.display = 'none';
            document.getElementById('view-create').style.display = 'none';
            document.getElementById('view-passbook').style.display = 'flex';
            
            document.querySelectorAll('.account-item').forEach(el => el.classList.remove('active'));
            element.classList.add('active');

            document.getElementById('pb-name').innerText = name;
            document.getElementById('pb-bal').innerText = parseFloat(balance).toFixed(2);
            document.getElementById('pb-type').innerText = type;
        }

        // --- DATA LOGIC ---

        async function fetchDirectory() {
            if(!currentShopId) return;
            const { data: vendors } = await supabaseClient.from('vendors').select('*').eq('shop_id', currentShopId).order('name');
            if (vendors) allVendors = vendors;
            renderList();
        }

        function renderList() {
            const list = document.getElementById('account-list');
            list.innerHTML = '';

            if (activeTab === 'vendors') {
                if (allVendors.length === 0) {
                    list.innerHTML = '<div class="empty-state">No vendors found.</div>';
                    return;
                }
                allVendors.forEach(v => {
                    const bal = v.outstanding_balance || 0;
                    list.innerHTML += `
                        <div class="account-item" onclick="openPassbook(this, '${v.id}', '${v.name}', ${bal}, 'Vendor')">
                            <span class="acc-name">${v.name}</span>
                            <span class="acc-bal">₹ ${parseFloat(bal).toFixed(2)}</span>
                        </div>
                    `;
                });
            } else {
                list.innerHTML = '<div class="empty-state">Finances table pending database update.</div>';
            }
        }

        async function saveNewAccount() {
            if (!currentShopId) return;
            
            const type = document.getElementById('new-type').value;
            const name = document.getElementById('new-name').value;
            const phone = document.getElementById('new-phone').value || null;
            const gst = document.getElementById('new-gst').value || null;
            const bal = parseFloat(document.getElementById('new-balance').value) || 0;

            if (!name) return alert("Account Name is required.");

            if (type === 'vendor') {
                // WARNING: Phone and GST won't save until we update the database columns next!
                const { error } = await supabaseClient.from('vendors').insert([{
                    shop_id: currentShopId,
                    name: name,
                    outstanding_balance: bal
                    // phone: phone, 
                    // gst_number: gst
                }]);

                if (error) return alert("Error: " + error.message);
                
                alert("Account created successfully!");
                
                // Clear form & refresh
                document.getElementById('new-name').value = '';
                document.getElementById('new-phone').value = '';
                document.getElementById('new-gst').value = '';
                document.getElementById('new-balance').value = '';
                
                await fetchDirectory();
                showEmptyView();
            } else {
                alert("Finance accounts require the new finances table in the database.");
            }
        }
    </script>
</body>
</html>
