<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accounts & Vendors</title>
    <script src="supabase-init.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f9fafb; color: #111827; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        .hidden { display: none !important; }
        .loader-container { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; width: 100vw; position: fixed; top: 0; left: 0; background: #f9fafb; z-index: 9999; }
        .spinner { border: 4px solid #e5e7eb; border-top: 4px solid #3b82f6; border-radius: 50%; width: 45px; height: 45px; animation: spin 1s linear infinite; margin-bottom: 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #auth-message { color: #64748b; font-weight: 600; font-size: 1.1em; letter-spacing: 0.5px; }

        .main-content { flex-grow: 1; padding: 20px; display: flex; gap: 20px; height: calc(100vh - 60px); box-sizing: border-box; }
        
        .directory-pane { width: 320px; background: #ffffff; border-radius: 8px; border: 1px solid #e5e7eb; display: flex; flex-direction: column; flex-shrink: 0; overflow: hidden; }
        .pane-header { padding: 15px 20px; border-bottom: 1px solid #f3f4f6; display: flex; justify-content: space-between; align-items: center; background: #f9fafb; }
        .pane-header h3 { margin: 0; font-size: 1.1em; font-weight: 600; }
        
        .search-box-container { padding: 10px 15px; border-bottom: 1px solid #f3f4f6; background: #ffffff; }
        .search-input { width: 100%; padding: 8px 12px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 0.9em; outline: none; box-sizing: border-box; background: #f9fafb; }
        .search-input:focus { border-color: #111827; background: #fff; }

        .tab-group { display: flex; border-bottom: 1px solid #f3f4f6; }
        .tab { flex: 1; padding: 10px; text-align: center; font-size: 0.8em; font-weight: 700; color: #6b7280; cursor: pointer; text-transform: uppercase; border-bottom: 2px solid transparent; background: #ffffff; }
        .tab.active { color: #111827; border-bottom-color: #111827; background: #f9fafb; }
        
        .account-list { overflow-y: auto; flex-grow: 1; padding: 10px; }
        .account-item { padding: 12px 15px; border-radius: 6px; cursor: pointer; margin-bottom: 4px; display: flex; justify-content: space-between; align-items: center; border: 1px solid transparent; transition: 0.2s; }
        .account-item:hover { background: #f3f4f6; }
        .account-item.active { background: #eff6ff; border-color: #bfdbfe; }
        .acc-name { font-weight: 600; font-size: 0.95em; color: #0f172a; }
        .acc-bal { font-size: 0.85em; font-weight: 700; color: #dc2626; }

        .passbook-pane { flex-grow: 1; background: #ffffff; border-radius: 8px; border: 1px solid #e5e7eb; display: none; flex-direction: column; overflow: hidden; }
        .pb-header { padding: 25px; text-align: center; border-bottom: 1px solid #f3f4f6; background: #ffffff; }
        .pb-type { font-size: 0.75em; font-weight: 700; color: #64748b; text-transform: uppercase; letter-spacing: 1px; }
        .pb-name { font-size: 1.6em; font-weight: 800; margin: 5px 0; color: #0f172a; }
        .pb-meta { font-size: 0.85em; color: #6b7280; margin-top: 5px; }
        .pb-bal-box { margin-top: 15px; padding-top: 15px; border-top: 1px solid #f3f4f6; }
        .pb-bal-label { font-size: 0.75em; color: #6b7280; text-transform: uppercase; font-weight: 700; letter-spacing: 0.5px; }
        .pb-bal { font-size: 2.2em; font-weight: 800; color: #dc2626; margin-top: 2px; letter-spacing: -1px; }
        
        .pb-actions { display: flex; gap: 10px; justify-content: center; padding: 15px 20px; background: #f8fafc; border-bottom: 1px solid #f3f4f6; flex-wrap: wrap; }
        
        .history-container { overflow-y: auto; flex-grow: 1; padding: 0; background: #ffffff; }
        .history-table { width: 100%; border-collapse: collapse; font-size: 0.9em; }
        .history-table th { text-align: left; padding: 12px 20px; border-bottom: 2px solid #e2e8f0; color: #64748b; font-weight: 700; text-transform: uppercase; font-size: 0.75em; }
        .history-table td { padding: 14px 20px; border-bottom: 1px solid #f1f5f9; color: #1e293b; font-weight: 500; }

        button.btn { background: #0f172a; color: #fff; border: none; padding: 9px 14px; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 0.85em; transition: 0.2s; }
        button.btn:hover { background: #334155; }
        button.btn-outline { background: #fff; color: #0f172a; border: 1px solid #cbd5e1; }
        button.btn-outline:hover { background: #f8fafc; }
        button.btn-green { background: #10b981; }
        button.btn-green:hover { background: #059669; }

        .empty-state { display: flex; align-items: center; justify-content: center; height: 100%; color: #9ca3af; font-size: 0.95em; text-align: center; padding: 30px; flex-direction: column; }

        @media (max-width: 768px) {
            body { overflow: auto; }
            .main-content { flex-direction: column; height: auto; overflow: visible; padding: 15px; }
            .directory-pane { width: 100%; height: 320px; flex-shrink: 0; }
            .passbook-pane { width: 100%; overflow: visible; }
            .pb-bal { font-size: 1.8em; }
            .pb-actions { flex-direction: column; gap: 8px; }
            .pb-actions button { width: 100%; }
        }
    </style>
</head>
<body>

    <script src="navbar.js"></script>

    <div id="unauthorized" class="loader-container">
        <div class="spinner" id="loading-spinner"></div>
        <div id="auth-message">Verifying Access...</div>
    </div>

    <main class="main-content hidden" id="admin-content">
        
        <div class="directory-pane">
            <div class="pane-header">
                <h3>Directory</h3>
                <button class="btn btn-outline admin-only hidden" onclick="openAddAccountModal()" style="padding: 6px 10px; font-size: 0.75em;">+ Add New</button>
            </div>
            
            <div class="search-box-container">
                <input type="text" id="account-search" class="search-input" placeholder="Search accounts..." onkeyup="filterAccounts()">
            </div>

            <div class="tab-group">
                <div class="tab active" id="tab-vendors" onclick="switchTab('vendors')">Vendors</div>
                <div class="tab" id="tab-finances" onclick="switchTab('finances')">Finances / Kuri</div>
            </div>
            
            <div class="account-list" id="account-list">
                <div class="empty-state">Loading accounts...</div>
            </div>
        </div>

        <div class="passbook-pane" id="passbook-pane">
            <div id="pdf-export-area" style="display: flex; flex-direction: column; height: 100%;">
                <div class="pb-header">
                    <div class="pb-type" id="pb-type">Vendor Account</div>
                    <div class="pb-name" id="pb-name">Select an Account</div>
                    <div class="pb-meta" id="pb-meta">Phone: - | GST: -</div>
                    
                    <div class="pb-bal-box">
                        <div class="pb-bal-label">Total Outstanding Balance</div>
                        <div class="pb-bal">₹ <span id="pb-bal">0.00</span></div>
                    </div>
                </div>
                
                <div class="pb-actions no-print">
                    <button class="btn btn-green" onclick="openAddBillModal()">+ Add Due Bill / Installment</button>
                    <button class="btn" onclick="openPayModal()">Record Payment</button>
                    <button class="btn btn-outline" onclick="promptPDFDownload()">Download PDF</button>
                </div>
                
                <div class="history-container">
                    <table class="history-table">
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Description / Ref</th>
                                <th>Type</th>
                                <th style="text-align: right;">Amount (₹)</th>
                            </tr>
                        </thead>
                        <tbody id="pb-history">
                            <tr><td colspan="4" class="empty-state" style="border:none;">Select an account from the left.</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="passbook-pane" id="empty-pane" style="display: flex;">
            <div class="empty-state">
                <svg width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24" style="margin-bottom: 15px; opacity: 0.4;">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.042A8.967 8.967 0 006 3.75c-1.052 0-2.062.18-3 .512v14.25A8.987 8.987 0 016 18c2.305 0 4.408.867 6 2.292m0-14.25a8.966 8.966 0 016-2.292c1.052 0 2.062.18 3 .512v14.25A8.987 8.987 0 0018 18a8.967 8.967 0 00-6 2.292m0-14.25v14.25"></path>
                </svg>
                Select an account from the directory to view its passbook.
            </div>
        </div>

    </main>

    <script>
        let currentShopId = null;
        let isAdmin = false;
        let activeTab = 'vendors';
        
        let allVendors = [];
        let allFinances = [];
        
        let activeAccount = null; 
        let rawHistoryData = []; 

        window.onload = () => {
            setTimeout(async () => {
                try {
                    const { data: userData, error: authError } = await supabaseClient.auth.getUser();
                    if (authError || !userData || !userData.user) {
                        failAuth("ACCESS DENIED: Not logged in.");
                        return;
                    }

                    const { data: profile, error: profileError } = await supabaseClient
                        .from('user_profiles')
                        .select('role, shop_id')
                        .eq('id', userData.user.id)
                        .single();

                    if (profileError) {
                        failAuth("Database Error: " + profileError.message);
                        return;
                    }

                    currentShopId = profile.shop_id;
                    isAdmin = (profile.role === 'admin');

                    if (isAdmin) {
                        document.querySelectorAll('.admin-only').forEach(el => el.classList.remove('hidden'));
                    }

                    document.getElementById('unauthorized').classList.add('hidden');
                    document.getElementById('admin-content').classList.remove('hidden');

                    await fetchDirectory();
                } catch (err) {
                    failAuth("System Error: " + err.message);
                }
            }, 600);
        };

        function failAuth(msg) {
            document.getElementById('loading-spinner').style.display = 'none';
            const msgEl = document.getElementById('auth-message');
            msgEl.innerText = msg;
            msgEl.style.color = '#ef4444';
        }

        function switchTab(tabName) {
            activeTab = tabName;
            document.getElementById('tab-vendors').classList.remove('active');
            document.getElementById('tab-finances').classList.remove('active');
            document.getElementById(`tab-${tabName}`).classList.add('active');
            
            activeAccount = null;
            document.getElementById('passbook-pane').style.display = 'none';
            document.getElementById('empty-pane').style.display = 'flex';
            
            renderList();
        }

        function filterAccounts() {
            const query = document.getElementById('account-search').value.toLowerCase();
            const items = document.querySelectorAll('.account-item');
            items.forEach(item => {
                const name = item.querySelector('.acc-name').innerText.toLowerCase();
                item.style.display = name.includes(query) ? 'flex' : 'none';
            });
        }

        async function fetchDirectory() {
            if (!currentShopId) return;
            
            // STRICT CLASSIFICATION: Fetch all accounts for this shop
            const { data: accounts, error } = await supabaseClient
                .from('vendors')
                .select('*')
                .eq('shop_id', currentShopId)
                .order('name', { ascending: true });

            if (!error && accounts) {
                // Vendors = account_type is 'vendor' or NULL (for legacy items)
                allVendors = accounts.filter(a => a.account_type === 'vendor' || !a.account_type);
                // Finances = account_type is STRICTLY 'finance'
                allFinances = accounts.filter(a => a.account_type === 'finance');
            }
            renderList();
        }

        function renderList() {
            const list = document.getElementById('account-list');
            list.innerHTML = '';
            
            const activeData = activeTab === 'vendors' ? allVendors : allFinances;
            const emptyMsg = activeTab === 'vendors' ? 'No vendors found.' : 'No finance accounts found.';

            if (activeData.length === 0) {
                list.innerHTML = `<div class="empty-state">${emptyMsg}</div>`;
                return;
            }

            activeData.forEach(v => {
                const bal = parseFloat(v.outstanding_balance || 0).toFixed(2);
                const isSelected = activeAccount && activeAccount.id === v.id ? 'active' : '';
                list.innerHTML += `
                    <div class="account-item ${isSelected}" onclick='selectVendor(${JSON.stringify(v)}, this)'>
                        <span class="acc-name">${v.name}</span>
                        <span class="acc-bal">₹ ${bal}</span>
                    </div>
                `;
            });
        }

        async function selectVendor(vendor, element) {
            activeAccount = vendor;
            document.querySelectorAll('.account-item').forEach(el => el.classList.remove('active'));
            if (element) element.classList.add('active');

            document.getElementById('empty-pane').style.display = 'none';
            document.getElementById('passbook-pane').style.display = 'flex';

            document.getElementById('pb-name').innerText = vendor.name;
            document.getElementById('pb-bal').innerText = parseFloat(vendor.outstanding_balance || 0).toFixed(2);
            document.getElementById('pb-type').innerText = vendor.account_type === 'finance' ? 'Finance / Kuri Account' : 'Vendor Account';
            
            const metaText = vendor.account_type === 'finance' ? 
                `Acct/Phone: ${vendor.phone || '-'} | Ref: ${vendor.gst_number || '-'}` : 
                `Phone: ${vendor.phone || '-'} | GST: ${vendor.gst_number || '-'}`;
            document.getElementById('pb-meta').innerText = metaText;

            await loadVendorHistory(vendor.id);
        }

        async function loadVendorHistory(vendorId) {
            const tbody = document.getElementById('pb-history');
            tbody.innerHTML = `<tr><td colspan="4" style="text-align:center; padding: 20px; color: #9ca3af;">Loading history...</td></tr>`;

            // 1. Fetch Dues/Installments
            const { data: bills } = await supabaseClient.from('vendor_bills').select('*').eq('vendor_id', vendorId).order('bill_date', { ascending: false });
            
            // 2. Fetch Payments made from Reserve Vault
            const { data: reservePayouts } = await supabaseClient.from('master_ledger_logs').select('*').eq('shop_id', currentShopId).ilike('reference_note', `%${activeAccount.name}%`).order('created_at', { ascending: false });
            
            // 3. STRICT CLASSIFICATION: Fetch Payments made from Shop Floor Dashboard (Cash or UPI)
            const { data: floorPayouts } = await supabaseClient.from('daily_transactions').select('*').eq('vendor_id', vendorId).order('created_at', { ascending: false });

            rawHistoryData = [];
            
            if (bills) {
                bills.forEach(b => {
                    rawHistoryData.push({
                        dateStr: new Date(b.bill_date).toLocaleDateString('en-IN', { month: 'short', day: 'numeric', year: 'numeric' }),
                        ref: b.bill_number ? `Ref #${b.bill_number}` : 'Due Entry',
                        type: 'Due / Installment',
                        amount: parseFloat(b.amount),
                        isPositive: true, 
                        rawDate: new Date(b.bill_date)
                    });
                });
            }

            if (reservePayouts) {
                reservePayouts.forEach(p => {
                    if (p.amount < 0) { 
                        rawHistoryData.push({
                            dateStr: new Date(p.created_at).toLocaleDateString('en-IN', { month: 'short', day: 'numeric', year: 'numeric' }),
                            ref: p.reference_note || 'Payment Settled',
                            type: `Reserve Vault Payment`,
                            amount: parseFloat(Math.abs(p.amount)),
                            isPositive: false, 
                            rawDate: new Date(p.created_at)
                        });
                    }
                });
            }

            if (floorPayouts) {
                floorPayouts.forEach(fp => {
                    rawHistoryData.push({
                        dateStr: new Date(fp.created_at).toLocaleDateString('en-IN', { month: 'short', day: 'numeric', year: 'numeric' }),
                        ref: fp.reference_note || 'Floor Payment',
                        type: `Shop Floor Payout (${fp.payment_method})`,
                        amount: parseFloat(Math.abs(fp.amount)),
                        isPositive: false, 
                        rawDate: new Date(fp.created_at)
                    });
                });
            }

            rawHistoryData.sort((a, b) => b.rawDate - a.rawDate);
            renderTableHistory(rawHistoryData);
        }

        function renderTableHistory(data) {
            const tbody = document.getElementById('pb-history');
            tbody.innerHTML = '';

            if (data.length > 0) {
                data.forEach(item => {
                    const colorClass = item.isPositive ? 'text-red' : 'text-green';
                    const sign = item.isPositive ? '+' : '-';
                    tbody.innerHTML += `
                        <tr>
                            <td>${item.dateStr}</td>
                            <td>${item.ref}</td>
                            <td><strong>${item.type}</strong></td>
                            <td style="text-align: right; font-weight: 700;" class="${colorClass}">${sign} ₹ ${item.amount.toFixed(2)}</td>
                        </tr>
                    `;
                });
            } else {
                tbody.innerHTML = `<tr><td colspan="4" style="text-align:center; padding: 25px; color: #9ca3af;">No bills or payments recorded for this period.</td></tr>`;
            }
        }

        async function openAddAccountModal() {
            const isFin = activeTab === 'finances' ? 'selected' : '';
            const isVen = activeTab === 'vendors' ? 'selected' : '';

            const { value: formValues } = await Swal.fire({
                title: 'Create New Account',
                html: `
                    <select id="swal-type" class="swal2-input">
                        <option value="vendor" ${isVen}>Vendor / Supplier</option>
                        <option value="finance" ${isFin}>Finance / Kuri / Bank</option>
                    </select>
                    <input id="swal-name" class="swal2-input" placeholder="Account Name (Required)">
                    <input id="swal-phone" class="swal2-input" placeholder="Phone or Acct No. (Optional)">
                    <input id="swal-gst" class="swal2-input" placeholder="GST or Ref ID (Optional)">
                    <input id="swal-bal" class="swal2-input" type="number" placeholder="Opening Balance Owed (₹)">
                `,
                focusConfirm: false,
                showCancelButton: true,
                confirmButtonText: 'Save Account',
                confirmButtonColor: '#0f172a',
                preConfirm: () => {
                    const name = document.getElementById('swal-name').value;
                    if (!name) {
                        Swal.showValidationMessage('Account Name is required');
                        return false;
                    }
                    return {
                        type: document.getElementById('swal-type').value,
                        name: name,
                        phone: document.getElementById('swal-phone').value || null,
                        gst: document.getElementById('swal-gst').value || null,
                        balance: parseFloat(document.getElementById('swal-bal').value) || 0
                    };
                }
            });

            if (formValues) {
                const { error } = await supabaseClient.from('vendors').insert([{
                    shop_id: currentShopId,
                    account_type: formValues.type,
                    name: formValues.name,
                    phone: formValues.phone,
                    gst_number: formValues.gst,
                    outstanding_balance: formValues.balance
                }]);

                if (error) {
                    Swal.fire('Error', 'Failed to create account: ' + error.message, 'error');
                } else {
                    Swal.fire({ title: 'Success!', text: 'Account created successfully.', icon: 'success', timer: 1500, showConfirmButton: false });
                    await fetchDirectory();
                }
            }
        }

        async function openAddBillModal() {
            if (!activeAccount) return Swal.fire('Select Account', 'Please select an account first.', 'warning');
            
            const titleLabel = activeAccount.account_type === 'finance' ? 'Add Installment Due' : 'Add Due Bill';

            const { value: billData } = await Swal.fire({
                title: `${titleLabel}: ${activeAccount.name}`,
                html: `
                    <input id="swal-bill-no" class="swal2-input" placeholder="Reference / Invoice No.">
                    <input id="swal-bill-amt" class="swal2-input" type="number" placeholder="Amount (₹) (Required)">
                    <input id="swal-bill-date" class="swal2-input" type="date" value="${new Date().toISOString().split('T')[0]}">
                `,
                focusConfirm: false,
                showCancelButton: true,
                confirmButtonText: 'Save Entry',
                confirmButtonColor: '#10b981',
                preConfirm: () => {
                    const amount = parseFloat(document.getElementById('swal-bill-amt').value);
                    if (!amount || amount <= 0) {
                        Swal.showValidationMessage('Enter a valid amount');
                        return false;
                    }
                    return {
                        billNumber: document.getElementById('swal-bill-no').value || '-',
                        amount: amount,
                        date: document.getElementById('swal-bill-date').value
                    };
                }
            });

            if (billData) {
                const { error: billError } = await supabaseClient.from('vendor_bills').insert([{
                    shop_id: currentShopId,
                    vendor_id: activeAccount.id,
                    bill_number: billData.billNumber,
                    amount: billData.amount,
                    bill_date: billData.date
                }]);

                if (billError) return Swal.fire('Error', 'Failed to save entry: ' + billError.message, 'error');

                const newBalance = parseFloat(activeAccount.outstanding_balance || 0) + billData.amount;
                await supabaseClient.from('vendors').update({ outstanding_balance: newBalance }).eq('id', activeAccount.id);

                activeAccount.outstanding_balance = newBalance;
                Swal.fire({ title: 'Logged!', text: `Added ₹${billData.amount} to balance.`, icon: 'success', timer: 1500, showConfirmButton: false });
                
                await fetchDirectory();
                selectVendor(activeAccount);
            }
        }

        async function openPayModal() {
            if (!activeAccount) return Swal.fire('Select Account', 'Please select an account first.', 'warning');

            const { value: payData } = await Swal.fire({
                title: `Pay ${activeAccount.name}`,
                html: `
                    <input id="swal-pay-amt" class="swal2-input" type="number" placeholder="Payment Amount (₹) (Required)">
                    <select id="swal-pay-source" class="swal2-input">
                        <option value="RESERVE">Reserve (Vault Balance)</option>
                        <option value="DRAWER">Shop Drawer (Today's Cash)</option>
                        <option value="UPI">UPI / Digital (No Cash Deduction)</option>
                    </select>
                    <input id="swal-pay-note" class="swal2-input" placeholder="Reference Note">
                `,
                focusConfirm: false,
                showCancelButton: true,
                confirmButtonText: 'Confirm Payment',
                confirmButtonColor: '#0f172a',
                preConfirm: () => {
                    const amount = parseFloat(document.getElementById('swal-pay-amt').value);
                    if (!amount || amount <= 0) {
                        Swal.showValidationMessage('Enter a valid payment amount');
                        return false;
                    }
                    return {
                        amount: amount,
                        source: document.getElementById('swal-pay-source').value,
                        note: document.getElementById('swal-pay-note').value || `Paid to ${activeAccount.name}`
                    };
                }
            });

            if (payData) {
                const { data: shopData } = await supabaseClient.from('shops').select('master_ledger_balance').eq('id', currentShopId).single();
                let currentReserve = parseFloat(shopData.master_ledger_balance || 0);

                if (payData.source === 'RESERVE' && payData.amount > currentReserve) {
                    return Swal.fire('Insufficient Funds', 'Not enough balance in the Reserve Vault.', 'error');
                }

                if (payData.source === 'RESERVE') {
                    const newReserve = currentReserve - payData.amount;
                    await supabaseClient.from('shops').update({ master_ledger_balance: newReserve }).eq('id', currentShopId);
                    
                    await supabaseClient.from('master_ledger_logs').insert([{
                        shop_id: currentShopId,
                        transaction_type: 'VENDOR_PAYOUT',
                        reference_note: `${payData.note} (Paid via Reserve)`,
                        amount: -payData.amount
                    }]);
                } 
                else if (payData.source === 'DRAWER') {
                    await supabaseClient.from('daily_transactions').insert([{
                        shop_id: currentShopId,
                        transaction_type: 'EXPENSE',
                        category: activeAccount.account_type === 'finance' ? 'finance' : 'vendor',
                        payment_method: 'CASH',
                        amount: payData.amount,
                        vendor_id: activeAccount.id,
                        reference_note: `${payData.note} (Paid from Drawer)`,
                        status: 'open'
                    }]);
                }
                else if (payData.source === 'UPI') {
                    await supabaseClient.from('daily_transactions').insert([{
                        shop_id: currentShopId,
                        transaction_type: 'EXPENSE',
                        category: activeAccount.account_type === 'finance' ? 'finance' : 'vendor',
                        payment_method: 'UPI',
                        amount: payData.amount,
                        vendor_id: activeAccount.id,
                        reference_note: `${payData.note} (Paid via UPI)`,
                        status: 'open'
                    }]);
                }

                const newBalance = parseFloat(activeAccount.outstanding_balance || 0) - payData.amount;
                await supabaseClient.from('vendors').update({ outstanding_balance: newBalance }).eq('id', activeAccount.id);

                activeAccount.outstanding_balance = newBalance;
                Swal.fire({ title: 'Payment Recorded!', text: `Successfully paid ₹${payData.amount} via ${payData.source}.`, icon: 'success', timer: 1500, showConfirmButton: false });
                
                await fetchDirectory();
                selectVendor(activeAccount);
            }
        }

        async function promptPDFDownload() {
            if (!activeAccount) return;

            const { value: timeFilter } = await Swal.fire({
                title: 'Download Statement PDF',
                input: 'select',
                inputOptions: { 'all': 'All Time History', '30': 'Last 30 Days', 'month': 'This Current Month' },
                inputPlaceholder: 'Select time period',
                showCancelButton: true,
                confirmButtonText: 'Download',
                confirmButtonColor: '#0f172a'
            });

            if (!timeFilter) return;

            let filteredData = [...rawHistoryData];
            const now = new Date();

            if (timeFilter === '30') {
                const thirtyDaysAgo = new Date();
                thirtyDaysAgo.setDate(now.getDate() - 30);
                filteredData = filteredData.filter(item => item.rawDate >= thirtyDaysAgo);
            } else if (timeFilter === 'month') {
                filteredData = filteredData.filter(item => item.rawDate.getMonth() === now.getMonth() && item.rawDate.getFullYear() === now.getFullYear());
            }

            renderTableHistory(filteredData);

            const element = document.getElementById('pdf-export-area');
            const opt = {
                margin:       10,
                filename:     `${activeAccount.name.replace(/\s+/g, '_')}_Statement.pdf`,
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2 },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };

            html2pdf().from(element).set(opt).save().then(() => {
                renderTableHistory(rawHistoryData);
            });
        }
    </script>
</body>
</html>
