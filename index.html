<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop Manager | Login</title>
    <script src="supabase-init.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f8fafc; color: #0f172a; display: flex; align-items: center; justify-content: center; height: 100vh; }
        
        .login-wrapper { width: 100%; max-width: 400px; padding: 20px; box-sizing: border-box; }
        .login-card { background: #ffffff; padding: 40px 30px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.06); border: 1px solid #e2e8f0; }
        
        .brand { text-align: center; margin-bottom: 30px; }
        .brand h1 { margin: 0; font-size: 1.8em; font-weight: 800; letter-spacing: -0.5px; color: #0f172a; }
        .brand p { margin: 5px 0 0 0; color: #64748b; font-size: 0.9em; font-weight: 500; }

        label { display: block; font-weight: 700; font-size: 0.85em; margin-bottom: 8px; color: #475569; text-transform: uppercase; letter-spacing: 0.5px; }
        input { width: 100%; padding: 14px; margin-bottom: 20px; box-sizing: border-box; border-radius: 8px; border: 1px solid #cbd5e1; background-color: #f8fafc; font-size: 1em; transition: all 0.2s; outline: none; }
        input:focus { border-color: #0f172a; background-color: #ffffff; box-shadow: 0 0 0 3px rgba(15, 23, 42, 0.05); }

        button { background-color: #0f172a; color: #ffffff; border: none; padding: 14px; border-radius: 8px; width: 100%; font-size: 1em; font-weight: 700; cursor: pointer; transition: 0.2s; }
        button:hover { background-color: #334155; transform: translateY(-1px); }
        button:disabled { background-color: #94a3b8; cursor: not-allowed; transform: none; }

        .loader-container { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; width: 100vw; position: fixed; top: 0; left: 0; background: #f9fafb; z-index: 9999; }
        .spinner { border: 4px solid #e5e7eb; border-top: 4px solid #0f172a; border-radius: 50%; width: 45px; height: 45px; animation: spin 1s linear infinite; margin-bottom: 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- Initial Checking Auth State -->
    <div id="auth-checker" class="loader-container">
        <div class="spinner"></div>
        <div style="color: #64748b; font-weight: 600;">Verifying Session...</div>
    </div>

    <div class="login-wrapper hidden" id="login-ui">
        <div class="login-card">
            <div class="brand">
                <h1>Shop Manager</h1>
                <p>Sign in to your workspace</p>
            </div>
            
            <label>Email Address</label>
            <input type="email" id="email" placeholder="admin@shop.com" autocomplete="email">
            
            <label>Password</label>
            <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
            
            <button id="login-btn" onclick="handleLogin()">Sign In</button>
        </div>
    </div>

    <script>
        window.onload = async () => {
            // Check if user is already logged in
            const { data: sessionData } = await supabaseClient.auth.getSession();
            
            if (sessionData && sessionData.session) {
                // User has an active session, send them straight to the app
                window.location.href = 'dashboard.html';
            } else {
                // No session, reveal the login form
                document.getElementById('auth-checker').classList.add('hidden');
                document.getElementById('login-ui').classList.remove('hidden');
            }
        };

        async function handleLogin() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const btn = document.getElementById('login-btn');

            if (!email || !password) {
                return Swal.fire('Missing Details', 'Please enter both email and password.', 'warning');
            }

            btn.disabled = true;
            btn.innerText = 'Authenticating...';

            const { data, error } = await supabaseClient.auth.signInWithPassword({
                email: email,
                password: password,
            });

            if (error) {
                btn.disabled = false;
                btn.innerText = 'Sign In';
                return Swal.fire('Login Failed', error.message, 'error');
            }

            // Success! Send them to the dashboard. The dashboard's onload logic will handle their specific role.
            window.location.href = 'dashboard.html';
        }
    </script>
</body>
</html>
