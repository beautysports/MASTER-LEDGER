<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-init.js"></script>

    <style>
        :root {
            --bg: #f8fafc;
            --surface: #ffffff;
            --border: #e2e8f0;
            --border-focus: #94a3b8;
            --ink: #0f172a;
            --ink-muted: #64748b;
            --accent: #0f172a;
            --danger: #ef4444;
            --radius: 8px;
        }

        body {
            margin: 0;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg);
            color: var(--ink);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        .hidden { display: none !important; }

        /* --- Standard Enterprise Card --- */
        .login-card {
            background: var(--surface);
            padding: 40px;
            border-radius: var(--radius);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 10px 15px -3px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border);
            width: 100%;
            max-width: 400px;
            box-sizing: border-box;
            
            /* Smooth, non-bouncy animation */
            opacity: 0;
            transform: translateY(12px);
            animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- Header --- */
        .card-header {
            margin-bottom: 32px;
            text-align: left;
        }
        
        .brand-icon {
            width: 32px;
            height: 32px;
            margin-bottom: 20px;
            color: var(--ink);
        }

        .card-title {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin: 0;
            color: var(--ink);
        }

        /* --- Form Elements --- */
        .input-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--ink);
            margin-bottom: 8px;
        }
        
        input[type="email"], 
        input[type="password"] {
            width: 100%;
            padding: 10px 12px;
            box-sizing: border-box;
            border-radius: 6px;
            border: 1px solid var(--border);
            background-color: var(--surface);
            font-size: 0.95rem;
            font-family: inherit;
            color: var(--ink);
            transition: all 0.2s ease;
            outline: none;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.02);
        }
        
        input::placeholder { color: #a1a1aa; }
        
        input:focus {
            border-color: var(--border-focus);
            box-shadow: 0 0 0 1px var(--border-focus);
        }

        /* --- Remember Me --- */
        .remember-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 24px;
        }
        
        .remember-row input[type="checkbox"] {
            width: 14px;
            height: 14px;
            margin: 0;
            cursor: pointer;
            accent-color: var(--accent);
        }
        
        .remember-row label {
            margin: 0;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--ink-muted);
            cursor: pointer;
        }

        /* --- Button --- */
        .btn-submit {
            background-color: var(--accent);
            color: #ffffff;
            border: none;
            font-weight: 600;
            padding: 10px;
            border-radius: 6px;
            width: 100%;
            font-size: 0.9rem;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }
        
        .btn-submit:hover {
            background-color: #000000;
        }
        
        .btn-submit:disabled {
            background-color: var(--ink-muted);
            cursor: not-allowed;
        }

        /* --- Error Box --- */
        .error-msg {
            color: var(--danger);
            font-size: 0.85rem;
            margin-bottom: 20px;
            font-weight: 500;
            display: none;
        }

        /* --- Global Loader --- */
        .page-loader {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            width: 100vw;
            position: fixed;
            top: 0;
            left: 0;
            background: var(--bg);
            z-index: 9999;
        }
        
        .spinner {
            border: 2px solid var(--border);
            border-top: 2px solid var(--accent);
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 0.6s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* --- Footer --- */
        .sys-footer {
            margin-top: 24px;
            font-size: 0.75rem;
            font-weight: 500;
            color: var(--ink-muted);
            display: flex;
            align-items: center;
            gap: 6px;
        }
    </style>
</head>
<body>

    <div id="page-loader" class="page-loader">
        <div class="spinner"></div>
    </div>

    <div class="login-card hidden" id="login-ui">
        <div class="card-header">
            <svg class="brand-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
                <line x1="8" y1="21" x2="16" y2="21"></line>
                <line x1="12" y1="17" x2="12" y2="21"></line>
            </svg>
            <h1 class="card-title">Sign in</h1>
        </div>
        
        <form onsubmit="handleLogin(event)">
            <div class="input-group">
                <label for="email">Email address</label>
                <input type="email" id="email" autocomplete="email" required>
            </div>
            
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" autocomplete="current-password" required>
            </div>
            
            <div class="remember-row">
                <input type="checkbox" id="remember-me">
                <label for="remember-me">Remember me</label>
            </div>
            
            <div id="error-box" class="error-msg"></div>
            
            <button type="submit" id="login-btn" class="btn-submit">Continue</button>
        </form>
    </div>

    <div class="sys-footer hidden" id="sys-footer">
        Enterprise Ledger &middot; v1.9.2
    </div>

    <!-- Isolated Auth Logic -->
    <script src="auth.js"></script>
</body>
</html>
