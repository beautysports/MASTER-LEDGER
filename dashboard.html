<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terminal Dashboard</title>
    <style>
        /* Base & Typography */
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; max-width: 900px; margin: 40px auto; padding: 20px; background: #f4f5f7; color: #1a1a1a; }
        
        /* Layout & Containers */
        .nav-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 2px solid #e1e4e8; padding-bottom: 15px; }
        .nav-bar h2 { margin: 0; font-weight: 700; font-size: 1.4em; letter-spacing: -0.5px; }
        
        /* Summary Section */
        .summary-box { background: #fff; padding: 25px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); border-left: 4px solid #10b981; margin-bottom: 30px; text-align: center; }
        .summary-row { display: flex; justify-content: space-around; padding-top: 15px; border-top: 1px solid #e1e4e8; margin-top: 20px; align-items: center; }
        .balance-label { font-size: 0.75em; font-weight: 700; letter-spacing: 1.2px; color: #6b7280; text-transform: uppercase; }
        .balance-text { font-size: 2.8em; font-weight: 800; margin: 5px 0; color: #10b981; letter-spacing: -1.5px; }
        
        .metric-block { text-align: center; }
        .metric-value { font-size: 1.3em; font-weight: 700; margin-top: 4px; display: block; }
        .text-green { color: #10b981; }
        .text-red { color: #ef4444; }
        .text-blue { color: #3b82f6; }
        
        .upi-divider { border-left: 1px solid #e1e4e8; padding-left: 30px; }

        /* Grid & Cards */
        .action-grid { display: grid; grid-template-columns: 1fr; gap: 24px; }
        @media (min-width: 768px) { .action-grid { grid-template-columns: 1fr 1fr; } }
        .card { background: #fff; padding: 25px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); border: 1px solid #e1e4e8; }
        
        /* Form Elements */
        h3 { margin-top: 0; font-size: 1.1em; font-weight: 700; color: #111; margin-bottom: 20px; }
        label { font-weight: 600; font-size: 0.8em; display: block; margin-top: 15px; color: #4b5563; text-transform: uppercase; letter-spacing: 0.5px; }
        
        input, select { 
            width: 100%; padding: 12px; margin-top: 8px; box-sizing: border-box; 
            font-size: 0.95em; border-radius: 6px; border: 1px solid #d1d5db; background-color: #f9fafb;
            transition: border-color 0.2s, box-shadow 0.2s; outline: none; font-family: inherit;
        }
        input:focus, select:focus { border-color: #111; background-color: #fff; box-shadow: 0 0 0 3px rgba(0,0,0,0.05); }
        
        /* Buttons */
        button { 
            background-color: #111; color: #fff; border: none; cursor: pointer; font-weight: 600; 
            margin-top: 25px; padding: 14px; border-radius: 6px; font-size: 0.95em; transition: background-color 0.2s; width: 100%;
        }
        button:hover { background-color: #333; }
        
        .btn-outline { background-color: transparent; color: #111; border: 1px solid #d1d5db; margin-top: 0; }
        .btn-outline:hover { border-color: #111; background-color: #f9fafb; color: #111; }
        .logout-btn { background-color: #fff; color: #4b5563; border: 1px solid #d1d5db; padding: 6px 12px; width: auto; margin: 0; border-radius: 4px; font-size: 0.85em; }
        .logout-btn:hover { background-color: #f3f4f6; color: #111; }
        
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- TOP NAVIGATION -->
    <div class="nav-bar">
        <h2 id="shop-name-display">Active Terminal</h2>
        <button onclick="handleLogout()" class="logout-btn">Logout</button>
    </div>

    <!-- SUMMARY SECTION -->
    <div class="summary-box">
        <div class="balance-label">Cash Drawer Balance</div>
        <div class="balance-text">₹ <span id="display-balance">0.00</span></div>
        <div class="summary-row">
            <div class="metric-block">
                <span class="balance-label">Cash In</span> 
                <span class="metric-value text-green">₹ <span id="display-income">0.00</span></span>
            </div>
            <div class="metric-block">
                <span class="balance-label">Cash Out</span> 
                <span class="metric-value text-red">₹ <span id="display-expense">0.00</span></span>
            </div>
            <div class="metric-block upi-divider">
                <span class="balance-label">UPI Volume</span> 
                <span class="metric-value text-blue">₹ <span id="display-upi">0.00</span></span>
            </div>
        </div>
    </div>

    <!-- ACTION GRID -->
    <div class="action-grid">
        <!-- INCOME -->
        <div class="card">
            <h3>Record Income</h3>
            
            <label>Payment Mode</label>
            <select id="income-method">
                <option value="cash">Physical Cash</option>
                <option value="upi">UPI / Digital</option>
            </select>

            <label>Category</label>
            <select id="income-category">
                <option value="app_sales">App Sales</option>
                <option value="unrecorded_sales">Direct Sales</option>
                <option value="service">Service Income</option>
            </select>

            <label>Amount (₹)</label>
            <input type="number" id="income-amount" placeholder="0.00">
            
            <button onclick="submitIncome()">Save Income</button>
        </div>

        <!-- EXPENSE -->
        <div class="card">
            <h3>Record Expense</h3>
            
            <label>Category</label>
            <select id="expense-category" onchange="toggleExpenseSubcategories()">
                <option value="generic">General Supply / Misc</option>
                <option value="vendor">Vendor Payout</option>
                <option value="staff">Staff Wage / Advance</option>
                <option value="finance">Finance / Rent</option>
            </select>

            <div id="group-vendor" class="hidden sub-group">
                <label>Vendor</label>
                <select id="vendor-list">
                    <option value="v1">Supply Co.</option>
                </select>
            </div>

            <div id="group-staff" class="hidden sub-group">
                <label>Staff Member</label>
                <select id="staff-list">
                    <option value="s1">John Doe</option>
                </select>
            </div>

            <div id="group-finance" class="hidden sub-group">
                <label>Account</label>
                <select id="finance-list">
                    <option value="f1">Daily Loan</option>
                </select>
            </div>

            <label>Amount (₹)</label>
            <input type="number" id="expense-amount" placeholder="0.00">

            <button onclick="submitExpense()">Save Expense</button>
        </div>
    </div>

    <!-- SETTINGS LINK -->
    <div style="text-align: center; margin-top: 40px; padding-bottom: 40px;">
        <button onclick="window.location.href='accounts.html'" class="btn-outline" style="max-width: 250px;">Manage Categories & Entities</button>
    </div>

    <!-- CORE ENGINE -->
    <script src="js/supabase-init.js"></script>

    <script>
        function toggleExpenseSubcategories() {
            const category = document.getElementById('expense-category').value;
            
            document.getElementById('group-vendor').classList.add('hidden');
            document.getElementById('group-staff').classList.add('hidden');
            document.getElementById('group-finance').classList.add('hidden');

            if (category === 'vendor') document.getElementById('group-vendor').classList.remove('hidden');
            if (category === 'staff') document.getElementById('group-staff').classList.remove('hidden');
            if (category === 'finance') document.getElementById('group-finance').classList.remove('hidden');
        }

        async function submitIncome() {
            const amount = document.getElementById('income-amount').value;
            if(!amount) return alert("Amount required.");
            alert("Income logged.");
        }

        async function submitExpense() {
            const amount = document.getElementById('expense-amount').value;
            if(!amount) return alert("Amount required.");
            alert("Expense logged.");
        }

        async function handleLogout() {
            await supabaseClient.auth.signOut();
            window.location.href = 'index.html'; 
        }
    </script>
</body>
</html>
