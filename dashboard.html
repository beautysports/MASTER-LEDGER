<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terminal Dashboard</title>
    <!-- Core Engine must load BEFORE navbar -->
    <script src="supabase-init.js"></script>
    <style>
        /* Only styles specific to the main content go here now */
        body { margin: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: #f0f2f5; color: #1e293b; display: flex; height: 100vh; }
        .main-content { flex-grow: 1; overflow-y: auto; padding: 40px; }
        
        .summary-box { background: #ffffff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); border-left: 5px solid #10b981; margin-bottom: 30px; text-align: center; }
        .summary-row { display: flex; justify-content: space-around; font-size: 0.95em; color: #64748b; padding-top: 15px; border-top: 1px solid #f1f5f9; margin-top: 15px; }
        .balance-text { font-size: 2.5em; font-weight: 800; margin: 5px 0; color: #10b981; }

        .action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 25px; }
        .card { background: white; padding: 25px; border-radius: 12px; border: 1px solid #e2e8f0; }
        
        h3 { margin-top: 0; border-bottom: 2px solid #f1f5f9; padding-bottom: 12px; }
        label { font-weight: 700; font-size: 0.75em; display: block; margin-top: 20px; text-transform: uppercase; }
        input, select { width: 100%; padding: 12px; margin-top: 8px; box-sizing: border-box; border-radius: 8px; border: 1px solid #cbd5e1; background-color: #f8fafc; }
        button.action-btn { background-color: #0f172a; color: #fff; border: none; cursor: pointer; font-weight: 600; margin-top: 25px; padding: 14px; border-radius: 8px; width: 100%; }
        
        .hidden { display: none !important; }
        
        @media (max-width: 768px) {
            body { flex-direction: column; }
            .action-grid { grid-template-columns: 1fr; }
            .main-content { padding: 20px; }
        }
    </style>
</head>
<body>

    <!-- INJECT THE NAVBAR MODULE -->
    <script src="navbar.js"></script>

    <!-- MAIN CONTENT AREA -->
    <main class="main-content">
        
        <div class="summary-box">
            <div style="text-transform: uppercase; font-size: 0.85em; font-weight: 700;">Expected Physical Cash</div>
            <div class="balance-text">₹ <span id="display-balance">0.00</span></div>
            <div class="summary-row">
                <div><span style="display:block;">Cash In</span> <strong style="color:#10b981;">₹ 0.00</strong></div>
                <div><span style="display:block;">Cash Out</span> <strong style="color:#ef4444;">₹ 0.00</strong></div>
                <div><span style="display:block;">Total UPI</span> <strong style="color:#3b82f6;">₹ 0.00</strong></div>
            </div>
        </div>

        <div class="action-grid">
            <!-- INCOME CARD -->
            <div class="card">
                <h3>Log Income</h3>
                <label>Amount (₹)</label>
                <input type="number" id="income-amount" placeholder="0.00">
                <button class="action-btn" onclick="submitIncome()">Record Income</button>
            </div>

            <!-- EXPENSE CARD -->
            <div class="card">
                <h3>Log Expense</h3>
                <label>Amount (₹)</label>
                <input type="number" id="expense-amount" placeholder="0.00">
                <button class="action-btn" onclick="submitExpense()">Record Expense</button>
            </div>
        </div>
    </main>

    <script>
        // Form logic goes here (wired in previous steps)
        async function submitIncome() { alert("Ready"); }
        async function submitExpense() { alert("Ready"); }
        async function handleLogout() { await supabaseClient.auth.signOut(); window.location.href = 'index.html'; }
    </script>
</body>
</html>
