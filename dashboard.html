<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop Dashboard</title>
    <script src="supabase-init.js"></script>
    <style>
        /* ULTRA-MINIMALIST UI */
        body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f9fafb; color: #111827; display: flex; height: 100vh; overflow: hidden; }
        .main-content { flex-grow: 1; overflow-y: auto; padding: 40px; }
        
        /* FLAT CARDS */
        .card { background: #ffffff; padding: 30px; border-radius: 8px; border: 1px solid #e5e7eb; margin-bottom: 25px; }
        .card-full { grid-column: span 2; }
        
        /* TOP SUMMARY */
        .summary-header { text-align: center; margin-bottom: 20px; }
        .master-label { color: #6b7280; font-size: 0.75em; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; }
        .master-balance { font-size: 3.5rem; font-weight: 700; margin: 0; letter-spacing: -1.5px; }
        
        .summary-row { display: flex; justify-content: center; gap: 50px; border-top: 1px solid #f3f4f6; padding-top: 25px; margin-top: 25px; }
        .summary-stat { text-align: center; }
        .summary-stat span { display: block; font-size: 0.75em; color: #6b7280; margin-bottom: 5px; text-transform: uppercase; font-weight: 600; }
        .summary-stat strong { font-size: 1.25em; font-weight: 600; }
        
        .text-green { color: #059669; } .text-red { color: #dc2626; } .text-blue { color: #2563eb; }

        /* GRID */
        .action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 25px; margin-bottom: 25px; }
        
        h3 { margin-top: 0; font-size: 1.1em; font-weight: 600; margin-bottom: 20px; border-bottom: 1px solid #f3f4f6; padding-bottom: 15px; color: #111827; }
        label { font-weight: 500; font-size: 0.85em; display: block; margin-top: 15px; color: #4b5563; }
        
        /* FLAT INPUTS */
        input, select { width: 100%; padding: 10px 12px; margin-top: 6px; box-sizing: border-box; border-radius: 6px; border: 1px solid #d1d5db; background-color: #f9fafb; font-size: 0.95em; transition: all 0.2s; outline: none; }
        input:focus, select:focus { border-color: #111827; background-color: #ffffff; }
        
        /* MINIMAL BUTTON */
        button.action-btn { background-color: #111827; color: #ffffff; border: none; cursor: pointer; font-weight: 500; margin-top: 25px; padding: 12px; border-radius: 6px; width: 100%; font-size: 0.95em; transition: 0.2s; }
        button.action-btn:hover { background-color: #374151; }

        /* ADMIN TOOLBAR - CLEANED UP */
        .hidden { display: none !important; }
        .admin-toolbar { background: #fef2f2; border: 1px solid #fecaca; padding: 12px 20px; border-radius: 6px; margin-bottom: 25px; display: flex; justify-content: space-between; align-items: center; color: #991b1b; }
        .admin-date-input { width: 180px; margin: 0; padding: 6px 10px; border-color: #fca5a5; background: #ffffff; color: #991b1b; }

        /* HISTORY TABLE */
        .history-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.9em; }
        .history-table th { text-align: left; padding: 10px; border-bottom: 2px solid #e5e7eb; color: #6b7280; font-weight: 500; font-size: 0.85em; }
        .history-table td { padding: 12px 10px; border-bottom: 1px solid #f3f4f6; color: #1f2937; }
        
        .edit-btn { background: transparent; border: 1px solid #d1d5db; color: #4b5563; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 0.8em; transition: 0.2s; }
        .edit-btn:hover { background: #f3f4f6; color: #111827; border-color: #9ca3af; }

        @media (max-width: 768px) {
            body { flex-direction: column; overflow: auto; }
            .action-grid { grid-template-columns: 1fr; }
            .card-full { grid-column: span 1; }
            .admin-toolbar { flex-direction: column; align-items: flex-start; gap: 10px; }
        }
    </style>
</head>
<body>

    <script src="navbar.js"></script>

    <main class="main-content">
        
        <!-- ADMIN OVERRIDE -->
        <div id="admin-toolbar" class="admin-toolbar hidden">
            <div>
                <strong style="display: block; font-size: 0.9em;">Admin Override Active</strong>
                <span style="font-size: 0.8em;">Posting entries to a specific past date.</span>
            </div>
            <input type="date" id="override-date" class="admin-date-input">
        </div>

        <!-- SUMMARY -->
        <div class="card summary-header">
            <div class="master-label">Physical Cash</div>
            <div class="master-balance">₹ <span id="display-balance">0.00</span></div>
            <div class="summary-row">
                <div class="summary-stat"><span>Cash In</span> <strong class="text-green">₹ <span id="display-income">0.00</span></strong></div>
                <div class="summary-stat"><span>Cash Out</span> <strong class="text-red">₹ <span id="display-expense">0.00</span></strong></div>
                <div class="summary-stat"><span>UPI</span> <strong class="text-blue">₹ <span id="display-upi">0.00</span></strong></div>
            </div>
        </div>

        <div class="action-grid">
            <!-- INCOME -->
            <div class="card">
                <h3>Income</h3>
                <label>Method</label>
                <select id="income-method">
                    <option value="CASH">Cash</option>
                    <option value="UPI">UPI</option>
                </select>
                <label>Category</label>
                <select id="income-category">
                    <option value="SALES">Sales</option>
                    <option value="OTHER">Other</option>
                </select>
                <label>Amount (₹)</label>
                <input type="number" id="income-amount" placeholder="0.00">
                <button class="action-btn" onclick="submitIncome()">Record</button>
            </div>

            <!-- EXPENSE -->
            <div class="card">
                <h3>Expense</h3>
                <label>Method</label>
                <select id="expense-method">
                    <option value="CASH">Cash</option>
                    <option value="UPI">UPI</option>
                </select>
                <label>Category</label>
                <select id="expense-category" onchange="toggleExpenseFields()">
                    <option value="none" selected disabled>Select...</option>
                    <option value="vendor">Vendor</option>
                    <option value="staff">Staff</option>
                    <option value="generic">General</option>
                </select>

                <div id="vendor-group" class="hidden">
                    <label>Select Vendor</label>
                    <select id="vendor-select"><option value="">Loading...</option></select>
                </div>
                <div id="staff-group" class="hidden">
                    <label>Select Staff</label>
                    <select id="staff-select"><option value="">Loading...</option></select>
                </div>

                <label>Amount (₹)</label>
                <input type="number" id="expense-amount" placeholder="0.00">
                <label>Note</label>
                <input type="text" id="expense-note" placeholder="Optional">
                <button class="action-btn" onclick="submitExpense()">Record</button>
            </div>
        </div>

        <!-- HISTORY -->
        <div class="action-grid">
            <div class="card card-full">
                <h3>Floor Transactions</h3>
                <table class="history-table">
                    <thead>
                        <tr>
                            <th>Time</th>
                            <th>Type</th>
                            <th>Method</th>
                            <th>Ref</th>
                            <th style="text-align: right;">Amount (₹)</th>
                            <th class="admin-only-col hidden" style="text-align: center; width: 60px;">Edit</th>
                        </tr>
                    </thead>
                    <tbody id="txn-body">
                        <tr><td colspan="6" style="text-align:center;">Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <script>
        let currentShopId = null;
        let isAdmin = false;

        function toggleExpenseFields() {
            const cat = document.getElementById('expense-category').value;
            document.getElementById('vendor-group').classList.add('hidden');
            document.getElementById('staff-group').classList.add('hidden');
            if (cat === 'vendor') document.getElementById('vendor-group').classList.remove('hidden');
            if (cat === 'staff') document.getElementById('staff-group').classList.remove('hidden');
        }

        window.onload = () => {
            document.getElementById('override-date').valueAsDate = new Date();
            
            setTimeout(async () => {
                const { data: userData } = await supabaseClient.auth.getUser();
                if (userData && userData.user) {
                    const { data: profile } = await supabaseClient.from('user_profiles').select('role, shop_id').eq('id', userData.user.id).single();
                    if (profile) {
                        currentShopId = profile.shop_id;
                        isAdmin = (profile.role === 'admin');
                        
                        if (isAdmin) {
                            document.getElementById('admin-toolbar').classList.remove('hidden');
                            document.querySelectorAll('.admin-only-col').forEach(el => el.classList.remove('hidden'));
                        }

                        await loadDropdowns(currentShopId);
                        await loadDashboardData(currentShopId);
                    }
                }
            }, 600); 
        };

        async function loadDropdowns(shopId) {
            const { data: vendors } = await supabaseClient.from('vendors').select('id, name').eq('shop_id', shopId);
            const vendorSelect = document.getElementById('vendor-select');
            vendorSelect.innerHTML = '<option value="none" selected disabled>Choose Vendor...</option>';
            if (vendors) vendors.forEach(v => vendorSelect.innerHTML += `<option value="${v.id}">${v.name}</option>`);

            const { data: staff } = await supabaseClient.from('staff').select('id, name').eq('shop_id', shopId);
            const staffSelect = document.getElementById('staff-select');
            staffSelect.innerHTML = '<option value="none" selected disabled>Choose Staff...</option>';
            if (staff) staff.forEach(s => staffSelect.innerHTML += `<option value="${s.id}">${s.name}</option>`);
        }

        async function loadDashboardData(shopId) {
            // FIXED: Added error catching here
            const { data: txns, error } = await supabaseClient.from('daily_transactions')
                .select('*')
                .eq('shop_id', shopId)
                .eq('status', 'open')
                .order('created_at', { ascending: false });
            
            if (error) {
                alert("Fetch Error: " + error.message);
                console.error(error);
                return;
            }

            let cashIn = 0, cashOut = 0, totalUpi = 0;
            const tbody = document.getElementById('txn-body');
            tbody.innerHTML = '';

            if (txns && txns.length > 0) {
                txns.forEach(txn => {
                    const amt = parseFloat(txn.amount);
                    if (txn.payment_method === 'UPI') totalUpi += amt; 
                    else if (txn.payment_method === 'CASH') {
                        if (txn.transaction_type === 'INCOME') cashIn += amt;
                        if (txn.transaction_type === 'EXPENSE') cashOut += amt;
                    }

                    const isIncome = txn.transaction_type === 'INCOME';
                    const colorClass = isIncome ? 'text-green' : 'text-red';
                    const sign = isIncome ? '+' : '-';
                    const timeStr = new Date(txn.created_at).toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' });
                    
                    let adminEditBtn = isAdmin ? `<td style="text-align:center;"><button class="edit-btn" onclick="editTransaction('${txn.id}', ${amt})">Edit</button></td>` : '';
                    
                    tbody.innerHTML += `
                        <tr>
                            <td style="font-size: 0.85em; color: #6b7280;">${timeStr}</td>
                            <td><strong>${(txn.category || 'OTHER').toUpperCase()}</strong></td>
                            <td style="font-size: 0.85em;">${txn.payment_method}</td>
                            <td>${txn.reference_note || '-'}</td>
                            <td class="${colorClass}" style="text-align: right; font-weight: 500;">${sign} ${amt.toFixed(2)}</td>
                            ${adminEditBtn}
                        </tr>
                    `;
                });
            } else {
                tbody.innerHTML = `<tr><td colspan="${isAdmin ? 6 : 5}" style="text-align:center; padding: 30px; color: #9ca3af;">No transactions logged today.</td></tr>`;
            }

            document.getElementById('display-income').innerText = cashIn.toFixed(2);
            document.getElementById('display-expense').innerText = cashOut.toFixed(2);
            document.getElementById('display-upi').innerText = totalUpi.toFixed(2);
            document.getElementById('display-balance').innerText = (cashIn - cashOut).toFixed(2);
        }

        function getSubmissionDate() {
            if (isAdmin) {
                const dateVal = document.getElementById('override-date').value;
                if (dateVal) {
                    const now = new Date();
                    return `${dateVal}T${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}:${now.getSeconds().toString().padStart(2, '0')}Z`;
                }
            }
            return new Date().toISOString();
        }

        async function submitIncome() { 
            if(!currentShopId) return;
            const category = document.getElementById('income-category').value;
            const method = document.getElementById('income-method').value;
            const amount = parseFloat(document.getElementById('income-amount').value);
            
            if(!amount || amount <= 0) return alert("Enter a valid amount.");

            // FIXED: Explicitly setting status to 'open'
            const { error } = await supabaseClient.from('daily_transactions').insert([{
                shop_id: currentShopId, 
                transaction_type: 'INCOME', 
                category: category, 
                payment_method: method, 
                amount: amount,
                status: 'open',
                created_at: getSubmissionDate()
            }]);

            if (error) return alert("Error: " + error.message);
            document.getElementById('income-amount').value = '';
            
            // FIXED: Using await to ensure the table refreshes instantly
            await loadDashboardData(currentShopId);
        }

        async function submitExpense() { 
            if(!currentShopId) return;
            const category = document.getElementById('expense-category').value;
            const method = document.getElementById('expense-method').value;
            const amount = parseFloat(document.getElementById('expense-amount').value);
            const note = document.getElementById('expense-note').value;
            
            if(category === 'none') return alert("Select a category.");
            if(!amount || amount <= 0) return alert("Enter a valid amount.");

            let vendor_id = null, staff_id = null;
            if (category === 'vendor') {
                vendor_id = document.getElementById('vendor-select').value;
                if (vendor_id === 'none') return alert("Select a vendor.");
            } else if (category === 'staff') {
                staff_id = document.getElementById('staff-select').value;
                if (staff_id === 'none') return alert("Select staff.");
            }

            // FIXED: Explicitly setting status to 'open'
            const { error } = await supabaseClient.from('daily_transactions').insert([{
                shop_id: currentShopId, 
                transaction_type: 'EXPENSE', 
                category: category, 
                payment_method: method, 
                amount: amount, 
                reference_note: note, 
                vendor_id: vendor_id, 
                staff_id: staff_id,
                status: 'open',
                created_at: getSubmissionDate()
            }]);

            if (error) return alert("Error: " + error.message);
            document.getElementById('expense-amount').value = '';
            document.getElementById('expense-note').value = '';
            
            // FIXED: Using await to ensure the table refreshes instantly
            await loadDashboardData(currentShopId);
        }

        async function editTransaction(txnId, currentAmount) {
            const newAmountStr = prompt("ADMIN OVERRIDE: Enter the correct amount (₹):", currentAmount);
            if (newAmountStr === null) return; 
            
            const newAmount = parseFloat(newAmountStr);
            if (isNaN(newAmount) || newAmount <= 0) return alert("Invalid amount.");
            
            const { error } = await supabaseClient.from('daily_transactions').update({ amount: newAmount }).eq('id', txnId);
            
            if (error) return alert("Database Error: " + error.message);
            await loadDashboardData(currentShopId);
        }
    </script>
</body>
</html>
