<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Ledger</title>
    <script src="supabase-init.js"></script>
    <style>
        /* Base & Sidebar Layout */
        body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f0f2f5; color: #1e293b; display: flex; height: 100vh; overflow: hidden; }
        .main-content { flex-grow: 1; overflow-y: auto; padding: 40px; }
        
        /* Dashboard Replica UI */
        .summary-box { background: #0f172a; padding: 35px 25px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); margin-bottom: 30px; text-align: center; color: white; }
        .master-label { color: #94a3b8; font-size: 0.85em; text-transform: uppercase; letter-spacing: 1.5px; font-weight: 700; margin-bottom: 5px; }
        .master-balance { font-size: 3.5em; font-weight: 800; color: #fbbf24; margin: 0; letter-spacing: -2px; }

        .action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 25px; margin-bottom: 25px; }
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; }
        .card-full { grid-column: span 2; }
        
        h3 { margin-top: 0; color: #0f172a; font-weight: 700; border-bottom: 2px solid #f1f5f9; padding-bottom: 12px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
        label { font-weight: 700; font-size: 0.75em; display: block; margin-top: 15px; color: #64748b; text-transform: uppercase; letter-spacing: 0.5px; }
        
        input, select { width: 100%; padding: 12px; margin-top: 8px; box-sizing: border-box; border-radius: 8px; border: 1px solid #cbd5e1; background-color: #f8fafc; outline: none; font-size: 0.95em; color: #0f172a; transition: 0.2s; }
        input:focus, select:focus { border-color: #3b82f6; background-color: #fff; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1); }
        
        button.action-btn { color: #fff; border: none; cursor: pointer; font-weight: 700; margin-top: 25px; padding: 14px; border-radius: 8px; width: 100%; font-size: 0.95em; transition: 0.2s; }
        .btn-green { background-color: #10b981; } .btn-green:hover { background-color: #059669; }
        .btn-red { background-color: #ef4444; } .btn-red:hover { background-color: #dc2626; }

        .hidden { display: none !important; }
        
        /* History & Search */
        .search-bar { width: 250px; padding: 8px 12px; margin-top: 0; font-size: 0.85em; border-radius: 20px; }
        .history-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.95em; }
        .history-table th { text-align: left; padding: 12px; border-bottom: 2px solid #e2e8f0; color: #64748b; text-transform: uppercase; font-size: 0.75em; }
        .history-table td { padding: 12px; border-bottom: 1px solid #f1f5f9; color: #334155; }
        .text-green { color: #10b981; font-weight: 700; }
        .text-red { color: #ef4444; font-weight: 700; }

        @media (max-width: 768px) {
            body { flex-direction: column; }
            .action-grid { grid-template-columns: 1fr; }
            .card-full { grid-column: span 1; }
            .search-bar { width: 100%; margin-top: 15px; }
            h3 { flex-direction: column; align-items: flex-start; }
        }
    </style>
</head>
<body>

    <!-- INJECT NAVBAR -->
    <script src="navbar.js"></script>

    <main class="main-content">
        
        <!-- TOP: LIVE LEDGER BALANCE -->
        <div class="summary-box">
            <div class="master-label">Master Vault Balance</div>
            <div class="master-balance">₹ <span id="ledger-balance">0.00</span></div>
        </div>

        <!-- MIDDLE: THE ACTION GRID (DASHBOARD REPLICA) -->
        <div class="action-grid">
            
            <!-- CREDIT (MONEY IN) -->
            <div class="card" style="border-top: 4px solid #10b981;">
                <h3 style="border-bottom-color: #d1fae5;">Credit Ledger (Money In)</h3>
                
                <label>Category</label>
                <select id="credit-category">
                    <option value="CAPITAL">Owner Capital Injection</option>
                    <option value="MANUAL_SWEEP">Manual Shop Sweep</option>
                    <option value="MISC_IN">Miscellaneous Income</option>
                </select>

                <label>Amount (₹)</label>
                <input type="number" id="credit-amount" placeholder="0.00">

                <label>Reference Note</label>
                <input type="text" id="credit-note" placeholder="e.g., Added funds for rent">

                <button class="action-btn btn-green" onclick="submitCredit()">Add Funds</button>
            </div>

            <!-- DEBIT (MONEY OUT) -->
            <div class="card" style="border-top: 4px solid #ef4444;">
                <h3 style="border-bottom-color: #fee2e2;">Debit Ledger (Money Out)</h3>
                
                <label>Category</label>
                <select id="debit-category" onchange="toggleVendorField()">
                    <option value="none" selected disabled>Select...</option>
                    <option value="VENDOR">Vendor</option>
                    <option value="DRAWINGS">Drawings</option>
                    <option value="FINANCE">Finance / EMI</option>
                    <option value="MISC_OUT">Miscellaneous</option>
                </select>

                <div id="vendor-group" class="hidden">
                    <label>Select Vendor</label>
                    <select id="vendor-select">
                        <option value="">Loading vendors...</option>
                    </select>
                </div>

                <label>Amount (₹)</label>
                <input type="number" id="debit-amount" placeholder="0.00">

                <label>Reference Note</label>
                <input type="text" id="debit-note" placeholder="e.g., Settled bill #104">

                <button class="action-btn btn-red" onclick="submitDebit()">Deduct Funds</button>
            </div>
        </div>

        <!-- BOTTOM: HISTORY WITH SEARCH -->
        <div class="action-grid">
            <div class="card card-full">
                <h3>
                    Recent Transactions
                    <input type="text" id="search-history" class="search-bar" placeholder="Search by note, type, or amount..." onkeyup="filterHistory()">
                </h3>
                <table class="history-table">
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Category</th>
                            <th>Reference</th>
                            <th style="text-align: right;">Amount (₹)</th>
                        </tr>
                    </thead>
                    <tbody id="history-body">
                        <tr><td colspan="4" style="text-align:center;">Loading history...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <!-- CORE LOGIC -->
    <script>
        let currentShopId = null;
        let currentLedgerBalance = 0;

        // UI Toggle
        function toggleVendorField() {
            const category = document.getElementById('debit-category').value;
            const vendorGroup = document.getElementById('vendor-group');
            if (category === 'VENDOR') vendorGroup.classList.remove('hidden');
            else vendorGroup.classList.add('hidden');
        }

        // Live Search Filter
        function filterHistory() {
            const input = document.getElementById('search-history').value.toLowerCase();
            const rows = document.getElementById('history-body').getElementsByTagName('tr');
            for (let i = 0; i < rows.length; i++) {
                const rowText = rows[i].innerText.toLowerCase();
                rows[i].style.display = rowText.includes(input) ? '' : 'none';
            }
        }

        // Initialize
        window.onload = () => {
            setTimeout(async () => {
                const { data: shopData } = await supabaseClient.from('shops').select('id, master_ledger_balance').single();
                if (shopData) {
                    currentShopId = shopData.id;
                    currentLedgerBalance = parseFloat(shopData.master_ledger_balance || 0);
                    document.getElementById('ledger-balance').innerText = currentLedgerBalance.toFixed(2);
                    
                    await loadLedgerVendors(currentShopId);
                    await loadHistory(currentShopId);
                }
            }, 500); 
        };

        async function loadLedgerVendors(shopId) {
            const { data: vendors } = await supabaseClient.from('vendors').select('id, name, outstanding_balance').eq('shop_id', shopId);
            const vendorSelect = document.getElementById('vendor-select');
            vendorSelect.innerHTML = '<option value="none" selected disabled>Choose Vendor...</option>';
            if (vendors) {
                vendors.forEach(v => {
                    vendorSelect.innerHTML += `<option value="${v.id}">${v.name} (Owes: ₹${v.outstanding_balance || 0})</option>`;
                });
            }
        }

        async function loadHistory(shopId) {
            const { data: logs } = await supabaseClient.from('master_ledger_logs')
                .select('*').eq('shop_id', shopId).order('created_at', { ascending: false }).limit(30);
            
            const tbody = document.getElementById('history-body');
            tbody.innerHTML = '';

            if (logs && logs.length > 0) {
                logs.forEach(log => {
                    const isCredit = log.amount > 0;
                    const colorClass = isCredit ? 'text-green' : 'text-red';
                    const sign = isCredit ? '+' : '';
                    const dateStr = new Date(log.created_at).toLocaleDateString('en-IN', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
                    
                    tbody.innerHTML += `
                        <tr>
                            <td style="font-size: 0.85em; color: #64748b;">${dateStr}</td>
                            <td><strong>${log.transaction_type}</strong></td>
                            <td>${log.reference_note || '-'}</td>
                            <td class="${colorClass}" style="text-align: right;">${sign} ${parseFloat(log.amount).toFixed(2)}</td>
                        </tr>
                    `;
                });
            } else {
                tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;">No history found.</td></tr>';
            }
        }

        async function submitCredit() {
            if(!currentShopId) return;
            const category = document.getElementById('credit-category').value;
            const amount = parseFloat(document.getElementById('credit-amount').value);
            const note = document.getElementById('credit-note').value || 'System Credit';
            
            if(!amount || amount <= 0) return alert("Enter a valid amount.");

            const newBalance = currentLedgerBalance + amount;
            
            // 1. Update Vault Balance
            await supabaseClient.from('shops').update({ master_ledger_balance: newBalance }).eq('id', currentShopId);
            // 2. Log History
            await supabaseClient.from('master_ledger_logs').insert([{ shop_id: currentShopId, transaction_type: category, reference_note: note, amount: amount }]);

            document.getElementById('credit-amount').value = '';
            document.getElementById('credit-note').value = '';
            window.location.reload();
        }

        async function deductFromLedger() {
            if(!currentShopId) return;
            const category = document.getElementById('debit-category').value;
            const amount = parseFloat(document.getElementById('debit-amount').value);
            const note = document.getElementById('debit-note').value || 'System Debit';
            
            if(category === 'none') return alert("Select a category.");
            if(!amount || amount <= 0) return alert("Enter a valid amount.");
            if(amount > currentLedgerBalance) return alert("Insufficient funds in the Master Ledger.");

            let vendorId = null;
            if (category === 'VENDOR') {
                vendorId = document.getElementById('vendor-select').value;
                if(vendorId === 'none') return alert("Select a vendor.");
            }

            const newBalance = currentLedgerBalance - amount;
            
            // 1. Update Vault Balance
            await supabaseClient.from('shops').update({ master_ledger_balance: newBalance }).eq('id', currentShopId);
            
            // 2. Update Vendor Balance if applicable
            if (vendorId) {
                const { data: vData } = await supabaseClient.from('vendors').select('outstanding_balance').eq('id', vendorId).single();
                const currentOwed = parseFloat(vData.outstanding_balance || 0);
                await supabaseClient.from('vendors').update({ outstanding_balance: currentOwed - amount }).eq('id', vendorId);
            }

            // 3. Log History (Negative Amount)
            await supabaseClient.from('master_ledger_logs').insert([{ shop_id: currentShopId, transaction_type: category, reference_note: note, amount: -amount }]);

            document.getElementById('debit-amount').value = '';
            document.getElementById('debit-note').value = '';
            window.location.reload();
        }
    </script>
</body>
</html>
