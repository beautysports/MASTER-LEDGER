<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Ledger & Daily Closing</title>
    <script src="supabase-init.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f9fafb; color: #111827; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        .hidden { display: none !important; }

        .loader-container { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; width: 100vw; position: fixed; top: 0; left: 0; background: #f9fafb; z-index: 9999; }
        .spinner { border: 4px solid #e5e7eb; border-top: 4px solid #3b82f6; border-radius: 50%; width: 45px; height: 45px; animation: spin 1s linear infinite; margin-bottom: 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #auth-message { color: #64748b; font-weight: 600; font-size: 1.1em; letter-spacing: 0.5px; }

        .main-content { flex-grow: 1; padding: 25px; display: flex; flex-direction: column; gap: 20px; height: calc(100vh - 60px); box-sizing: border-box; overflow-y: auto; }
        
        /* TOP BALANCE CARD */
        .vault-card { background: #ffffff; padding: 30px; border-radius: 8px; border: 1px solid #e5e7eb; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 20px; }
        .vault-title { font-size: 0.75em; font-weight: 700; color: #64748b; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; }
        .vault-amount { font-size: 2.5em; font-weight: 800; color: #0f172a; margin: 0; letter-spacing: -1px; }
        
        .vault-actions { display: flex; gap: 10px; flex-wrap: wrap; }

        /* FILTER & CONTROL BAR */
        .control-bar { background: #ffffff; padding: 15px 20px; border-radius: 8px; border: 1px solid #e5e7eb; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; }
        .filter-group { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        
        input, select { padding: 8px 12px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 0.9em; outline: none; background: #f9fafb; color: #111827; }
        input:focus, select:focus { border-color: #111827; background: #fff; }

        /* LEDGER TABLE */
        .table-container { background: #ffffff; border-radius: 8px; border: 1px solid #e5e7eb; flex-grow: 1; display: flex; flex-direction: column; overflow: hidden; }
        .table-header-bar { padding: 15px 20px; border-bottom: 1px solid #f3f4f6; display: flex; justify-content: space-between; align-items: center; background: #f9fafb; }
        .table-header-bar h3 { margin: 0; font-size: 1em; font-weight: 600; }
        
        .history-container { overflow-y: auto; flex-grow: 1; }
        .history-table { width: 100%; border-collapse: collapse; font-size: 0.9em; }
        .history-table th { text-align: left; padding: 12px 20px; border-bottom: 2px solid #e2e8f0; color: #64748b; font-weight: 700; text-transform: uppercase; font-size: 0.75em; background: #ffffff; position: sticky; top: 0; }
        .history-table td { padding: 14px 20px; border-bottom: 1px solid #f1f5f9; color: #1e293b; font-weight: 500; }

        button.btn { background: #0f172a; color: #fff; border: none; padding: 9px 16px; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 0.85em; transition: 0.2s; }
        button.btn:hover { background: #334155; }
        button.btn-outline { background: #fff; color: #0f172a; border: 1px solid #cbd5e1; }
        button.btn-outline:hover { background: #f8fafc; }
        button.btn-green { background: #10b981; }
        button.btn-green:hover { background: #047857; }

        .text-green { color: #059669; font-weight: 700; }
        .text-red { color: #dc2626; font-weight: 700; }

        .empty-state { display: flex; align-items: center; justify-content: center; height: 100%; color: #9ca3af; font-size: 0.95em; text-align: center; padding: 40px; flex-direction: column; }

        @media (max-width: 768px) {
            body { overflow: auto; height: auto; }
            .main-content { height: auto; overflow: visible; padding: 15px; }
            .vault-card { flex-direction: column; align-items: flex-start; }
            .vault-actions { width: 100%; }
            .vault-actions button { flex: 1; }
            .control-bar { flex-direction: column; align-items: stretch; }
            .filter-group { width: 100%; flex-direction: column; }
            .filter-group input, .filter-group select { width: 100%; }
        }
    </style>
</head>
<body>

    <script src="navbar.js"></script>

    <div id="unauthorized" class="loader-container">
        <div class="spinner" id="loading-spinner"></div>
        <div id="auth-message">Verifying Master Ledger Access...</div>
    </div>

    <main class="main-content hidden" id="admin-content">
        
        <!-- TOP RESERVE / VAULT SUMMARY CARD -->
        <div class="vault-card">
            <div>
                <div class="vault-title">Total Reserve Fund (Vault)</div>
                <div class="vault-amount">₹ <span id="vault-balance">0.00</span></div>
            </div>
            <div class="vault-actions">
                <button class="btn btn-green" onclick="openAddFundsModal()">+ Add Money to Reserve</button>
                <button class="btn btn-outline" onclick="openWithdrawModal()">- Withdraw Money</button>
            </div>
        </div>

        <!-- CONTROLS & FILTER BAR -->
        <div class="control-bar">
            <div class="filter-group">
                <label style="font-size: 0.8em; font-weight: 700; color: #64748b; text-transform: uppercase;">View Source:</label>
                <select id="ledger-source-filter" onchange="applyFilters()">
                    <option value="ALL">All Transactions (Main & Daily)</option>
                    <option value="RESERVE">Reserve Vault Adjustments</option>
                    <option value="DAILY">Daily Shop Floor Closings</option>
                </select>
                
                <input type="date" id="filter-date-start" onchange="applyFilters()">
                <span style="color: #9ca3af; font-size: 0.85em;">to</span>
                <input type="date" id="filter-date-end" onchange="applyFilters()">
            </div>

            <button class="btn btn-outline" onclick="downloadLedgerPDF()">Download PDF Statement</button>
        </div>

        <!-- TRANSACTION TABLE -->
        <div class="table-container">
            <div class="table-header-bar">
                <h3 id="table-heading">Complete Ledger History</h3>
                <span style="font-size: 0.8em; color: #64748b;" id="record-count">Loading entries...</span>
            </div>
            
            <div class="history-container" id="pdf-export-area">
                <table class="history-table">
                    <thead>
                        <tr>
                            <th>Date & Time</th>
                            <th>Source</th>
                            <th>Description / Reference</th>
                            <th>Type</th>
                            <th style="text-align: right;">Amount (₹)</th>
                        </tr>
                    </thead>
                    <tbody id="ledger-body">
                        <tr><td colspan="5" class="empty-state">Loading transaction history...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <script>
        let currentShopId = null;
        let isAdmin = false;
        let masterTransactions = []; // Holds consolidated ledger history

        window.onload = () => {
            setTimeout(async () => {
                try {
                    const { data: userData, error: authError } = await supabaseClient.auth.getUser();
                    if (authError || !userData || !userData.user) {
                        failAuth("ACCESS DENIED: Not logged in.");
                        return;
                    }

                    const { data: profile, error: profileError } = await supabaseClient
                        .from('user_profiles')
                        .select('role, shop_id')
                        .eq('id', userData.user.id)
                        .single();

                    if (profileError) {
                        failAuth("Database Error: " + profileError.message);
                        return;
                    }

                    currentShopId = profile.shop_id;
                    isAdmin = (profile.role === 'admin');

                    if (!isAdmin) {
                        failAuth("ACCESS DENIED: Owner privileges required.");
                        return;
                    }

                    document.getElementById('unauthorized').classList.add('hidden');
                    document.getElementById('admin-content').classList.remove('hidden');

                    // Set default filter date range to current month
                    const now = new Date();
                    const firstDay = new Date(now.getFullYear(), now.getMonth(), 1).toISOString().split('T')[0];
                    const today = now.toISOString().split('T')[0];
                    document.getElementById('filter-date-start').value = firstDay;
                    document.getElementById('filter-date-end').value = today;

                    await loadMasterLedgerData();
                } catch (err) {
                    failAuth("System Error: " + err.message);
                }
            }, 600);
        };

        function failAuth(msg) {
            document.getElementById('loading-spinner').style.display = 'none';
            const msgEl = document.getElementById('auth-message');
            msgEl.innerText = msg;
            msgEl.style.color = '#ef4444';
        }

        async function loadMasterLedgerData() {
            if (!currentShopId) return;

            // 1. Fetch Shop Reserve Balance
            const { data: shopData } = await supabaseClient
                .from('shops')
                .select('master_ledger_balance')
                .eq('id', currentShopId)
                .single();

            const reserveBal = parseFloat(shopData?.master_ledger_balance || 0);
            document.getElementById('vault-balance').innerText = reserveBal.toFixed(2);

            masterTransactions = [];

            // 2. Fetch Reserve / Vault adjustments from master_ledger_logs
            const { data: reserveLogs } = await supabaseClient
                .from('master_ledger_logs')
                .select('*')
                .eq('shop_id', currentShopId)
                .order('created_at', { ascending: false });

            if (reserveLogs) {
                reserveLogs.forEach(log => {
                    const amt = parseFloat(log.amount);
                    masterTransactions.push({
                        id: log.id,
                        date: new Date(log.created_at),
                        dateStr: new Date(log.created_at).toLocaleString('en-IN', { month: 'short', day: 'numeric', year: 'numeric', hour: '2-digit', minute: '2-digit' }),
                        source: 'RESERVE',
                        sourceLabel: 'Reserve Vault',
                        ref: log.reference_note || 'Vault Adjustment',
                        type: amt >= 0 ? 'INCOME' : 'EXPENSE',
                        amount: Math.abs(amt)
                    });
                });
            }

            // 3. Fetch Daily Shop Floor Closings & Transactions from daily_transactions
            const { data: dailyTxns } = await supabaseClient
                .from('daily_transactions')
                .select('*')
                .eq('shop_id', currentShopId)
                .order('created_at', { ascending: false });

            if (dailyTxns) {
                dailyTxns.forEach(txn => {
                    const amt = parseFloat(txn.amount);
                    const isClosing = txn.reference_note && txn.reference_note.includes('Daily Cash Closing');
                    
                    masterTransactions.push({
                        id: txn.id,
                        date: new Date(txn.created_at),
                        dateStr: new Date(txn.created_at).toLocaleString('en-IN', { month: 'short', day: 'numeric', year: 'numeric', hour: '2-digit', minute: '2-digit' }),
                        source: 'DAILY',
                        sourceLabel: isClosing ? 'Daily Closing' : 'Shop Floor Entry',
                        ref: txn.reference_note || `${txn.transaction_type} (${txn.payment_method})`,
                        type: txn.transaction_type,
                        amount: amt
                    });
                });
            }

            // Sort newest first
            masterTransactions.sort((a, b) => b.date - a.date);

            applyFilters();
        }

        function applyFilters() {
            const sourceFilter = document.getElementById('ledger-source-filter').value;
            const startDateStr = document.getElementById('filter-date-start').value;
            const endDateStr = document.getElementById('filter-date-end').value;

            const startDate = startDateStr ? new Date(startDateStr) : null;
            const endDate = endDateStr ? new Date(endDateStr) : null;
            if (endDate) endDate.setHours(23, 59, 59, 999); // Include full end day

            let filtered = masterTransactions.filter(item => {
                if (sourceFilter !== 'ALL' && item.source !== sourceFilter) return false;
                if (startDate && item.date < startDate) return false;
                if (endDate && item.date > endDate) return false;
                return true;
            });

            renderTable(filtered);
        }

        function renderTable(data) {
            const tbody = document.getElementById('ledger-body');
            tbody.innerHTML = '';
            document.getElementById('record-count').innerText = `Showing ${data.length} records`;

            if (data.length > 0) {
                data.forEach(item => {
                    const isIncome = item.type === 'INCOME';
                    const colorClass = isIncome ? 'text-green' : 'text-red';
                    const sign = isIncome ? '+' : '-';

                    tbody.innerHTML += `
                        <tr>
                            <td>${item.dateStr}</td>
                            <td><span style="background: #f1f5f9; padding: 4px 8px; border-radius: 4px; font-size: 0.8em; font-weight: 700; color: #475569;">${item.sourceLabel}</span></td>
                            <td>${item.ref}</td>
                            <td><strong>${item.type}</strong></td>
                            <td style="text-align: right;" class="${colorClass}">${sign} ₹ ${item.amount.toFixed(2)}</td>
                        </tr>
                    `;
                });
            } else {
                tbody.innerHTML = `<tr><td colspan="5" class="empty-state">No transactions found matching the selected filters.</td></tr>`;
            }
        }

        // --- MANUAL RESERVE VAULT ACTIONS ---
        async function openAddFundsModal() {
            const { value: formValues } = await Swal.fire({
                title: 'Add Money to Reserve Vault',
                html: `
                    <input id="swal-amt" class="swal2-input" type="number" placeholder="Amount (₹) (Required)">
                    <input id="swal-note" class="swal2-input" placeholder="Reference Note (e.g., Owner Capital Injection)">
                `,
                focusConfirm: false,
                showCancelButton: true,
                confirmButtonText: 'Add Funds',
                confirmButtonColor: '#10b981',
                preConfirm: () => {
                    const amount = parseFloat(document.getElementById('swal-amt').value);
                    if (!amount || amount <= 0) {
                        Swal.showValidationMessage('Enter a valid amount');
                        return false;
                    }
                    return {
                        amount: amount,
                        note: document.getElementById('swal-note').value || 'Reserve Fund Deposit'
                    };
                }
            });

            if (formValues) {
                const { data: shopData } = await supabaseClient.from('shops').select('master_ledger_balance').eq('id', currentShopId).single();
                let currentReserve = parseFloat(shopData?.master_ledger_balance || 0);
                const newReserve = currentReserve + formValues.amount;

                await supabaseClient.from('shops').update({ master_ledger_balance: newReserve }).eq('id', currentShopId);

                await supabaseClient.from('master_ledger_logs').insert([{
                    shop_id: currentShopId,
                    transaction_type: 'DEPOSIT',
                    reference_note: formValues.note,
                    amount: formValues.amount
                }]);

                Swal.fire({ title: 'Success!', text: `Added ₹${formValues.amount} to Reserve.`, icon: 'success', timer: 1500, showConfirmButton: false });
                await loadMasterLedgerData();
            }
        }

        async function openWithdrawModal() {
            const { value: formValues } = await Swal.fire({
                title: 'Withdraw Money from Reserve',
                html: `
                    <input id="swal-amt" class="swal2-input" type="number" placeholder="Amount (₹) (Required)">
                    <input id="swal-note" class="swal2-input" placeholder="Reference Note (e.g., Owner Withdrawal)">
                `,
                focusConfirm: false,
                showCancelButton: true,
                confirmButtonText: 'Withdraw',
                confirmButtonColor: '#ef4444',
                preConfirm: () => {
                    const amount = parseFloat(document.getElementById('swal-amt').value);
                    if (!amount || amount <= 0) {
                        Swal.showValidationMessage('Enter a valid amount');
                        return false;
                    }
                    return {
                        amount: amount,
                        note: document.getElementById('swal-note').value || 'Reserve Fund Withdrawal'
                    };
                }
            });

            if (formValues) {
                const { data: shopData } = await supabaseClient.from('shops').select('master_ledger_balance').eq('id', currentShopId).single();
                let currentReserve = parseFloat(shopData?.master_ledger_balance || 0);

                if (formValues.amount > currentReserve) {
                    return Swal.fire('Insufficient Funds', 'Not enough balance in the Reserve Vault.', 'error');
                }

                const newReserve = currentReserve - formValues.amount;

                await supabaseClient.from('shops').update({ master_ledger_balance: newReserve }).eq('id', currentShopId);

                await supabaseClient.from('master_ledger_logs').insert([{
                    shop_id: currentShopId,
                    transaction_type: 'WITHDRAWAL',
                    reference_note: formValues.note,
                    amount: -formValues.amount
                }]);

                Swal.fire({ title: 'Success!', text: `Withdrew ₹${formValues.amount} from Reserve.`, icon: 'success', timer: 1500, showConfirmButton: false });
                await loadMasterLedgerData();
            }
        }

        function downloadLedgerPDF() {
            const element = document.getElementById('pdf-export-area');
            const opt = {
                margin:       10,
                filename:     `Master_Ledger_Statement.pdf`,
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2 },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };
            html2pdf().from(element).set(opt).save();
        }
    </script>
</body>
</html>
